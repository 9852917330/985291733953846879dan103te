<script>
const PEOPLE=[{"id":1,"name":"Bill Gates","era":"1955–nay","category":"Khoa học & kinh doanh","wiki":"Bill_Gates","crop":"Bill-Gates.jpg","uncertain":false,"fullbio":"Bill Gates là doanh nhân công nghệ Mỹ trưởng thành trong cuộc cách mạng máy tính cá nhân cuối thế kỷ XX. Năm 1975, ông cùng Paul Allen thành lập Microsoft, sau đó đưa Windows trở thành một trong những hệ điều hành phổ biến nhất. Ông còn nổi tiếng với hoạt động từ thiện trong y tế và giáo dục toàn cầu. Sinh tại Seattle, ông rời Harvard để theo đuổi ngành phần mềm khi máy vi tính còn mới mẻ. Microsoft trở thành doanh nghiệp có ảnh hưởng sâu rộng đến cách con người làm việc; về sau Gates chuyển phần lớn thời gian sang các chương trình phòng chống bệnh tật và giảm nghèo.\n\nMột bước ngoặt là hợp đồng cung cấp hệ điều hành cho máy tính IBM đầu thập niên 1980, giúp Microsoft xây dựng vị thế trong ngành phần mềm. Bộ Office và Windows đưa công ty đến hàng trăm triệu người dùng. Gates từng nhiều năm nằm trong nhóm người giàu nhất thế giới; các chương trình thiện nguyện của ông cũng tạo nên tranh luận về vai trò của các tỷ phú trong y tế công cộng.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Bill-Gates.jpg","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":true},{"id":2,"name":"Plato (có nguồn ghi Homer)","era":"khoảng 427–347 TCN","category":"Triết học & tôn giáo","wiki":"Plato","crop":"Plato-Philosophy.jpg","uncertain":true,"fullbio":"Plato là triết gia Athens sống ở Hy Lạp cổ đại vào thế kỷ V–IV trước Công nguyên. Ông là học trò của Socrates, thầy của Aristotle và người sáng lập Học viện Athens. Các tác phẩm đối thoại như Cộng hòa định hình sâu sắc triết học phương Tây; nhân vật trong tranh đôi khi bị gán khác là Homer. Plato viết nhiều đối thoại với Socrates là nhân vật trung tâm, bàn về đạo đức, tri thức và nhà nước lý tưởng. Các ý tưởng của ông tác động đến triết học, chính trị và thần học suốt hơn hai thiên niên kỷ; việc nhân vật trong tranh là Plato hay Homer vẫn có cách gán khác nhau.\n\nÔng mở Học viện ở Athens, nơi học trò nghiên cứu toán học, chính trị và các vấn đề căn bản của nhận thức. Học thuyết về các 'ý niệm' phân biệt thế giới cảm giác luôn biến đổi với những mẫu mực được cho là bền vững. Không có ảnh hay chân dung đáng tin được vẽ trực tiếp từ đời Plato; các hình hiện nay đều là tượng hoặc tái dựng.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Plato-Philosophy.jpg","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":true},{"id":3,"name":"Cui Jian – Thôi Kiện","era":"1961–nay","category":"Âm nhạc & điện ảnh","wiki":"Cui_Jian","crop":"cui-jian.jpg","uncertain":false,"fullbio":"Thôi Kiện là ca sĩ kiêm nhạc sĩ Trung Quốc nổi lên trong thập niên 1980. Ca khúc Nothing to My Name năm 1986 trở thành cột mốc của nhạc rock tiếng Hoa. Ông thường được gọi là cha đẻ của nhạc rock Trung Quốc. Xuất thân từ Bắc Kinh, Thôi Kiện gây tiếng vang với ca khúc Nothing to My Name năm 1986. Nhạc rock của ông gắn với một thế hệ thanh niên Trung Quốc trong thời kỳ đổi mới văn hóa, đồng thời từng đối mặt với các hạn chế biểu diễn.\n\nTrước khi chơi rock, ông học kèn trumpet trong môi trường nhạc giao hưởng. Âm nhạc của Thôi Kiện kết hợp rock phương Tây với ca từ tiếng Trung, đặt câu hỏi về bản sắc, tự do và sự chuyển biến xã hội. Ông được xem là người mở đường cho nhiều nghệ sĩ độc lập Trung Quốc sau này.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/cui-jian.jpg","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":true},{"id":4,"name":"Vladimir Lenin","era":"1870–1924","category":"Chính trị & quân sự","wiki":"Vladimir_Lenin","crop":"vladimir-lenin-painting.JPG","uncertain":false,"fullbio":"Lenin là nhà cách mạng Nga hoạt động cuối thế kỷ XIX và đầu thế kỷ XX. Ông dẫn dắt phe Bolshevik trong Cách mạng Tháng Mười năm 1917 và đứng đầu chính quyền Xô viết đầu tiên. Tư tưởng và mô hình chính trị của ông có ảnh hưởng lâu dài trên thế giới. Lenin trở thành nhà hoạt động Marxist chống chế độ Sa hoàng và trải qua nhiều năm lưu vong. Sau cách mạng 1917, chính quyền Bolshevik rút khỏi Thế chiến I, tiến hành nội chiến và xây dựng nhà nước Xô viết; di sản của ông vừa có ảnh hưởng to lớn vừa gây tranh cãi về độc quyền chính trị và đàn áp.\n\nTrong những năm đầu hoạt động, Lenin phát triển tổ chức đảng cách mạng theo mô hình đội tiên phong và viết nhiều tác phẩm chính trị, nổi bật có 'Làm gì?'. Sau khi giành chính quyền, ông triển khai Chính sách Kinh tế mới năm 1921 nhằm phục hồi sản xuất. Ông qua đời năm 1924; thi hài được gìn giữ tại lăng ở Moskva, còn cách đánh giá di sản Lenin khác nhau mạnh giữa các trường phái lịch sử.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/vladimir-lenin-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":5,"name":"Pavel Korchagin","era":"Nhân vật hư cấu, tiểu thuyết 1930s","category":"Văn học & triết học","wiki":"How_the_Steel_Was_Tempered","crop":"Pavel-Korchagin-painting.JPG","uncertain":false,"fullbio":"Pavel Korchagin không phải nhân vật lịch sử có thật mà là nhân vật chính trong tiểu thuyết Thép đã tôi thế đấy của Nikolai Ostrovsky. Tác phẩm xuất hiện trong thập niên 1930 tại Liên Xô. Pavel nổi tiếng như hình tượng ý chí, lý tưởng và sự hy sinh của lớp thanh niên cách mạng. Nhân vật do nhà văn Nikolai Ostrovsky xây dựng dựa một phần vào trải nghiệm của chính mình. Pavel được khắc họa như thanh niên tận tụy với lý tưởng cách mạng dù bệnh tật và khổ cực; câu chuyện được phổ biến rộng ở Liên Xô và nhiều nước xã hội chủ nghĩa.\n\nPavel trải qua chiến tranh, lao động gian khổ và những cuộc thử thách sức khỏe trong tiểu thuyết. Khái niệm 'thép đã tôi' trở thành ẩn dụ cho ý chí được rèn trong nghịch cảnh. Ảnh đối chiếu là hình ảnh diễn viên hoặc minh họa nhân vật, không phải ảnh của một người từng tồn tại.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Pavel-Korchagin-photo2.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":true,"photo_reenactment":false,"is_paired":false},{"id":6,"name":"Bill Clinton","era":"1946–nay","category":"Chính trị & quân sự","wiki":"Bill_Clinton","crop":"bill-clinton-painting.JPG","uncertain":false,"fullbio":"Bill Clinton là chính trị gia Mỹ nổi bật vào cuối thế kỷ XX. Ông giữ chức tổng thống Mỹ từ 1993 đến 2001, giai đoạn kinh tế Mỹ tăng trưởng mạnh. Nhiệm kỳ của ông cũng được nhớ đến bởi các tranh cãi chính trị và vụ luận tội năm 1998. Ông lớn lên tại Arkansas, trở thành thống đốc bang rồi đắc cử tổng thống năm 1992. Nhiệm kỳ của ông gắn với tăng trưởng kinh tế Mỹ trong thập niên 1990, nhưng cũng bị ảnh hưởng bởi bê bối Monica Lewinsky và thủ tục luận tội.\n\nChính quyền Clinton thông qua cải cách phúc lợi năm 1996 và tham gia các hoạt động ngoại giao tại Bắc Ireland, Trung Đông và Balkan. Ông là tổng thống Mỹ thứ hai bị Hạ viện luận tội nhưng được Thượng viện tuyên không có tội trong phiên xét xử năm 1999. Sau nhiệm kỳ, ông tham gia các hoạt động nhân đạo và gây quỹ quốc tế.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/bill-clinton-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":7,"name":"Peter Đại đế","era":"1672–1725","category":"Chính trị & quân sự","wiki":"Peter_the_Great","crop":"Peter-the-great-photo.JPG","uncertain":false,"fullbio":"Peter I là Sa hoàng và sau đó là hoàng đế Nga vào cuối thế kỷ XVII, đầu thế kỷ XVIII. Ông tiến hành cải cách quân đội, bộ máy nhà nước và thúc đẩy tiếp thu kỹ thuật Tây Âu. Việc xây dựng Saint Petersburg gắn liền với nỗ lực biến Nga thành cường quốc châu Âu. Lên ngôi từ cuối thế kỷ XVII, Peter đi khảo sát kỹ thuật đóng tàu và quân sự ở Tây Âu. Ông thúc đẩy xây dựng hải quân, cải cách bộ máy và lập Saint Petersburg; chính sách mở rộng lãnh thổ đưa Nga thành một thế lực lớn nhưng đòi hỏi tổn thất nhân lực đáng kể.\n\nSau cuộc Đại chiến phương Bắc chống Thụy Điển, Nga mở rộng ảnh hưởng đến biển Baltic. Peter áp đặt nhiều thay đổi về quân phục, tổ chức hành chính và phong tục triều đình để mô phỏng Tây Âu. Ông cũng thực thi quyền lực chuyên chế, tăng gánh nặng thuế và lao dịch đối với dân chúng.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Peter-the-great-painting2.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":8,"name":"Margaret Thatcher","era":"1925–2013","category":"Chính trị & quân sự","wiki":"Margaret_Thatcher","crop":"margaret-hilda-thatcher-painting.JPG","uncertain":false,"fullbio":"Margaret Thatcher là nữ thủ tướng đầu tiên của Anh, cầm quyền từ 1979 đến 1990. Bà thúc đẩy tư nhân hóa, cải cách công đoàn và đường lối kinh tế thị trường. Biệt danh Bà đầm thép phản ánh phong cách chính trị cứng rắn và gây tranh cãi của bà. Xuất thân từ ngành hóa học và luật, bà lãnh đạo Đảng Bảo thủ và cầm quyền tại Anh từ 1979 đến 1990. Những cải cách tư nhân hóa, kiềm chế lạm phát và hạn chế quyền lực công đoàn tạo ảnh hưởng lâu dài, đồng thời gây tranh luận sâu sắc về bất bình đẳng xã hội.\n\nThatcher thắng cử ba kỳ liên tiếp, đưa nước Anh đi theo chính sách kinh tế thường gọi là 'Thatcherism'. Bà giành được sự ủng hộ sau cuộc chiến Falklands năm 1982 nhưng gặp phản đối mạnh về chính sách thuế cộng đồng. Trên trường quốc tế, bà hợp tác chặt chẽ với Tổng thống Mỹ Ronald Reagan.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/margaret-hilda-thatcher-photo.jpg","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":9,"name":"Bruce Lee – Lý Tiểu Long","era":"1940–1973","category":"Âm nhạc & điện ảnh","wiki":"Bruce_Lee","crop":"bruce-lee-painting.JPG","uncertain":false,"fullbio":"Lý Tiểu Long là diễn viên và võ sư gốc Hoa nổi tiếng đầu thập niên 1970. Các phim như Enter the Dragon giúp điện ảnh võ thuật Hồng Kông vươn ra toàn cầu. Ông sáng lập triết lý võ thuật Jeet Kune Do và trở thành biểu tượng văn hóa đại chúng. Lý Tiểu Long sinh tại San Francisco, lớn lên ở Hồng Kông và phát triển sự nghiệp tại Mỹ. Ông sáng tạo hệ tư tưởng võ thuật Jeet Kune Do; các phim như The Big Boss, Fist of Fury và Enter the Dragon giúp phá vỡ định kiến về người châu Á trên màn ảnh toàn cầu.\n\nLý Tiểu Long luyện võ Vịnh Xuân khi còn nhỏ và sau đó nghiên cứu nhiều môn võ, thể lực, triết học và điện ảnh. Triết lý Jeet Kune Do nhấn mạnh tính thực dụng, loại bỏ động tác không cần thiết và sự thích ứng linh hoạt. Ông qua đời năm 1973 khi mới 32 tuổi, nhưng ảnh hưởng đến phim hành động và văn hóa luyện tập vẫn rất lớn.","portrait":"https://commons.wikimedia.org/wiki/Special:FilePath/Bruce%20Lee%201973%20%28cropped%29.jpg?width=480","portrait_src":"Wikimedia Commons","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":10,"name":"Winston Churchill","era":"1874–1965","category":"Chính trị & quân sự","wiki":"Winston_Churchill","crop":"winston-churchill-painting.JPG","uncertain":false,"fullbio":"Churchill là chính khách Anh giữ vai trò quyết định trong Thế chiến II. Với tư cách thủ tướng từ 1940, ông lãnh đạo Anh chống phát xít Đức và nổi tiếng nhờ tài diễn thuyết. Ông còn đoạt Nobel Văn học năm 1953 nhờ các tác phẩm lịch sử và hồi ký. Churchill từng là quân nhân, nhà báo rồi hoạt động nghị trường suốt nhiều thập niên. Các bài diễn văn khi Anh chống Đức Quốc xã biến ông thành biểu tượng tinh thần chiến tranh; song quan điểm đế quốc và một số quyết định thời thuộc địa vẫn bị phê phán.\n\nTrước và sau chiến tranh, Churchill từng giữ nhiều chức vụ bộ trưởng; ông cũng là họa sĩ nghiệp dư và tác giả của nhiều bộ sử. Chiến thắng năm 1945 không giúp ông giữ ghế thủ tướng: đảng Bảo thủ thất cử trước Công đảng. Ông trở lại lãnh đạo chính phủ giai đoạn 1951–1955, rồi nghỉ hưu khỏi vai trò thủ tướng.","portrait":"https://commons.wikimedia.org/wiki/Special:FilePath/Winston%20Churchill%20cph.3b13157.jpg?width=480","portrait_src":"Wikimedia Commons","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":11,"name":"Henri Matisse","era":"1869–1954","category":"Nghệ thuật & kiến trúc","wiki":"Henri_Matisse","crop":"henri-matisse-painting.JPG","uncertain":false,"fullbio":"Henri Matisse là họa sĩ Pháp hoạt động cuối thế kỷ XIX và nửa đầu thế kỷ XX. Ông là gương mặt quan trọng của trường phái Dã thú, dùng màu sắc mạnh và hình khối giản lược. Các bức tranh, bản vẽ và tác phẩm giấy cắt của ông có ảnh hưởng lớn đến nghệ thuật hiện đại. Matisse theo học luật trước khi chuyển sang hội họa tại Paris cuối thế kỷ XIX. Ông là gương mặt then chốt của trường phái Dã thú, sử dụng màu mạnh và hình khối giản lược; về cuối đời còn tạo ra các tác phẩm giấy cắt dán nổi tiếng.\n\nMatisse gây chú ý tại Salon d'Automne năm 1905, khi tranh màu sắc dữ dội của nhóm ông được gọi là 'Dã thú'. Tác phẩm tiêu biểu có 'The Dance' và 'The Red Studio'; tranh giấy cắt tạo ra ngôn ngữ thị giác đặc trưng ở giai đoạn cuối đời. Ông thường được đặt cạnh Picasso như một trong những người định hình nghệ thuật hiện đại thế kỷ XX.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/henri-matisse-birds-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":12,"name":"Thành Cát Tư Hãn","era":"khoảng 1162–1227","category":"Chính trị & quân sự","wiki":"Genghis_Khan","crop":"genghis-khan-painting.JPG","uncertain":false,"fullbio":"Thành Cát Tư Hãn thống nhất các bộ lạc Mông Cổ và thành lập Đế quốc Mông Cổ năm 1206. Những chiến dịch quân sự của ông trong thế kỷ XIII đã làm thay đổi bản đồ Á–Âu. Ông nổi tiếng về tài tổ chức quân đội, đồng thời các cuộc chinh phạt gây thiệt hại nhân mạng rất lớn. Sinh tại vùng thảo nguyên Mông Cổ, Temüjin thống nhất các bộ lạc và được tôn xưng Thành Cát Tư Hãn năm 1206. Những cuộc chinh phạt dựng nên một trong các đế quốc liên lục địa lớn nhất lịch sử, đồng thời gây thương vong và tàn phá rộng lớn.\n\nĐế quốc Mông Cổ tổ chức quân đội theo kỷ luật và cấu trúc thập phân, tận dụng kỵ binh cơ động và mạng lưới thông tin. Dưới ông và những người kế vị, các tuyến trao đổi hàng hóa, kiến thức nối rộng từ Á sang Âu. Hình ảnh hiện nay của Thành Cát Tư Hãn không phải chân dung đương thời đã được kiểm chứng.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/genghis-khan-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":true,"is_paired":false},{"id":13,"name":"Napoleon Bonaparte","era":"1769–1821","category":"Chính trị & quân sự","wiki":"Napoleon","crop":"Napoleon-Bonaparte-painting.JPG","uncertain":false,"fullbio":"Napoleon là danh tướng và hoàng đế Pháp nổi lên sau Cách mạng Pháp. Ông thống lĩnh các cuộc chiến lớn đầu thế kỷ XIX và cải cách luật pháp qua Bộ luật Napoleon. Thất bại tại Waterloo năm 1815 kết thúc thời kỳ thống trị châu Âu của ông. Napoleon nổi lên trong thời Cách mạng Pháp, nắm quyền năm 1799 rồi tự phong hoàng đế năm 1804. Bộ luật Napoleon để lại dấu ấn lâu dài trong pháp luật, nhưng các chiến dịch quân sự khắp châu Âu kết thúc bằng thất bại tại Waterloo năm 1815 và cuộc lưu đày.\n\nÔng xuất thân từ đảo Corsica, nổi bật nhờ tài pháo binh trong quân đội Cách mạng Pháp. Năm 1804, ông tự đăng quang hoàng đế, lập hàng loạt cải cách giáo dục, ngân hàng và hành chính; nhiều chuẩn mực pháp lý lưu lại đến nay. Sau thất bại đầu tiên, ông bị đày đến Elba, trở lại trong 'Một trăm ngày' rồi sống những năm cuối tại đảo Saint Helena.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Napoleon%20Bonaparte%20Photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":14,"name":"Che Guevara","era":"1928–1967","category":"Chính trị & quân sự","wiki":"Che_Guevara","crop":"che-guevara-painting.JPG","uncertain":false,"fullbio":"Che Guevara là bác sĩ người Argentina trở thành nhà cách mạng Marxist trong thập niên 1950. Ông tham gia cuộc cách mạng đưa Fidel Castro lên cầm quyền tại Cuba năm 1959. Sau khi bị giết ở Bolivia năm 1967, hình ảnh chân dung Che trở thành biểu tượng toàn cầu của phong trào cách mạng. Sinh tại Argentina, Che học y khoa rồi tham gia phong trào du kích của Fidel Castro ở Cuba. Sau chiến thắng năm 1959, ông giữ nhiều chức vụ nhà nước và tiếp tục hoạt động cách mạng tại Congo, Bolivia, nơi ông bị bắt và xử tử; hình ảnh của ông trở thành biểu tượng toàn cầu đầy tranh cãi.\n\nTrong thời gian tại Cuba, Che tham gia xây dựng chính sách công nghiệp và giữ vai trò tại Ngân hàng Quốc gia. Ông đề cao hình mẫu con người cách mạng, nhưng cũng bị phê phán về quan điểm dùng bạo lực và vai trò trong các vụ xử tử sau cách mạng. Bức ảnh chụp Che của Alberto Korda trở thành một trong những hình ảnh chính trị được tái bản nhiều nhất lịch sử.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/che-guevara-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":15,"name":"Fidel Castro","era":"1926–2016","category":"Chính trị & quân sự","wiki":"Fidel_Castro","crop":"fidel-castro-painting.JPG","uncertain":false,"fullbio":"Fidel Castro lãnh đạo Cách mạng Cuba và nắm quyền từ năm 1959. Ông xây dựng nhà nước xã hội chủ nghĩa ở Cuba và đối đầu với Mỹ trong Chiến tranh Lạnh. Vai trò của ông gây tranh cãi do thành tựu về y tế, giáo dục đi cùng hạn chế quyền tự do chính trị. Castro chỉ huy cuộc lật đổ chính quyền Batista năm 1959 và trở thành lãnh đạo Cuba trong Chiến tranh Lạnh. Ông thúc đẩy các chương trình y tế, giáo dục nhưng cai trị trong hệ thống một đảng, hạn chế đối lập và tự do chính trị; quan hệ với Liên Xô dẫn đến khủng hoảng tên lửa 1962.\n\nSau cuộc đổ bộ thất bại ở Vịnh Con Lợn năm 1961, quan hệ Cuba–Mỹ tiếp tục căng thẳng. Cuộc khủng hoảng tên lửa Cuba năm 1962 đưa thế giới sát nguy cơ chiến tranh hạt nhân. Castro giữ vai trò lãnh đạo hàng thập niên, chuyển giao chức vụ cho em trai Raúl trong những năm cuối đời.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/fidel-castro-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":16,"name":"Marlon Brando","era":"1924–2004","category":"Âm nhạc & điện ảnh","wiki":"Marlon_Brando","crop":"marlon-brando-painting.JPG","uncertain":false,"fullbio":"Marlon Brando là diễn viên Mỹ nổi tiếng giữa thế kỷ XX. Ông góp phần phổ biến lối diễn xuất nhập vai hiện đại qua A Streetcar Named Desire và On the Waterfront. Vai Vito Corleone trong The Godfather năm 1972 trở thành hình ảnh kinh điển của điện ảnh. Brando được đào tạo diễn xuất theo phương pháp hiện thực tâm lý và gây đột phá qua A Streetcar Named Desire. Ông giành Oscar với On the Waterfront và The Godfather, định hình diễn xuất điện ảnh Mỹ thế kỷ XX; sự nghiệp đồng thời gắn với những lựa chọn công khai về quyền dân sự.\n\nBrando được đánh giá cao nhờ lối diễn tự nhiên, đôi khi phá vỡ cách thoại và cử chỉ sân khấu Hollywood đương thời. Vai Don Vito Corleone năm 1972 đưa ông trở thành biểu tượng văn hóa phổ biến. Ông từng từ chối nhận Oscar nhằm phản đối cách Hollywood khắc họa người Mỹ bản địa.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/marlon-brando-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":17,"name":"Yasser Arafat","era":"1929–2004","category":"Chính trị & quân sự","wiki":"Yasser_Arafat","crop":"yasser-arafat-painting.JPG","uncertain":false,"fullbio":"Yasser Arafat là lãnh đạo phong trào dân tộc Palestine trong nửa sau thế kỷ XX. Ông đứng đầu Tổ chức Giải phóng Palestine và là nhân vật trung tâm của tiến trình hòa bình Oslo. Ông nhận Nobel Hòa bình năm 1994 cùng Yitzhak Rabin và Shimon Peres. Arafat là người đứng đầu Fatah và lâu năm lãnh đạo Tổ chức Giải phóng Palestine. Ông chuyển từ đấu tranh vũ trang sang tiến trình ngoại giao, ký các thỏa thuận Oslo và nhận Nobel Hòa bình năm 1994 cùng Yitzhak Rabin và Shimon Peres; vai trò của ông vẫn gây tranh luận.\n\nArafat sinh trong một gia đình Palestine và tham gia tổ chức Fatah cuối thập niên 1950. Ông trở thành gương mặt quốc tế của khát vọng tự quyết Palestine, nhưng bị chỉ trích về các hoạt động vũ trang gắn với tổ chức. Thỏa thuận Oslo mang đến chính quyền tự quản Palestine song không giải quyết dứt điểm các tranh chấp cốt lõi.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/yasser-arafat-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":18,"name":"Julius Caesar","era":"100–44 TCN","category":"Chính trị & quân sự","wiki":"Julius_Caesar","crop":"julius-caesar-painting.JPG","uncertain":false,"fullbio":"Julius Caesar là danh tướng và chính khách Cộng hòa La Mã ở thế kỷ I trước Công nguyên. Việc ông chinh phục xứ Gaul rồi chiến thắng nội chiến đã tập trung quyền lực vào tay mình. Ông bị ám sát năm 44 TCN và không phải hoàng đế La Mã theo nghĩa chức danh về sau. Caesar chinh phục xứ Gaul và vượt sông Rubicon năm 49 TCN, mở đầu cuộc nội chiến La Mã. Ông trở thành nhà độc tài và tiến hành cải cách, nhưng bị ám sát năm 44 TCN; ông không phải vị hoàng đế đầu tiên, danh hiệu này gắn với Augustus.\n\nCác chiến dịch quân sự của Caesar đưa quyền kiểm soát La Mã sang vùng Gaul, đồng thời giúp ông xây dựng quyền lực chính trị vượt trội. Ông thực hiện cải cách lịch Julius, đặt nền móng cho nhiều hệ thống lịch sau này. Vụ ám sát tại Thượng viện dẫn tới những cuộc nội chiến mới và sau cùng là chế độ hoàng đế dưới Augustus.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/julius-caesar-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":19,"name":"Claire Lee Chennault","era":"1890–1958","category":"Chính trị & quân sự","wiki":"Claire_Lee_Chennault","crop":"claire-lee-chennault-painting.JPG","uncertain":false,"fullbio":"Chennault là phi công và sĩ quan không quân Mỹ hoạt động nổi bật trong Thế chiến II. Ông chỉ huy đội tình nguyện Phi Hổ hỗ trợ Trung Quốc chống Nhật Bản. Tên tuổi ông gắn với các chiến thuật không chiến và quan hệ Mỹ–Trung thời chiến. Chennault là sĩ quan không quân Mỹ được biết đến qua việc tổ chức đội Phi Hổ hỗ trợ Trung Quốc chống Nhật trong Thế chiến II. Những phi công tình nguyện dưới quyền ông lập thành tích không chiến và tiếp vận nổi bật, biến ông thành một nhân vật được kính trọng trong ký ức chiến tranh Trung–Mỹ.\n\nChennault chỉ huy đội phi công tình nguyện Mỹ mang biệt danh 'Flying Tigers', nổi bật với máy bay có mũi sơn hàm cá mập. Đơn vị chiến đấu hỗ trợ Trung Quốc khi nước này kháng chiến chống Nhật. Ông là gương mặt kết nối lịch sử quân sự Trung Quốc và Mỹ trong nửa đầu thế kỷ XX.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/claire-lee-chennault-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":20,"name":"Luciano Pavarotti","era":"1935–2007","category":"Âm nhạc & điện ảnh","wiki":"Luciano_Pavarotti","crop":"luciano-pavoratti.JPG","uncertain":false,"fullbio":"Pavarotti là ca sĩ opera giọng tenor người Ý nổi tiếng cuối thế kỷ XX. Ông chinh phục công chúng qua các vở opera và buổi hòa nhạc Three Tenors. Bản trình diễn Nessun dorma trở thành một trong những tiết mục opera quen thuộc nhất thế giới. Xuất thân tại Modena, Ý, Pavarotti nổi danh với giọng tenor sáng và kỹ thuật thanh nhạc opera xuất sắc. Nhóm Three Tenors cùng Plácido Domingo và José Carreras đưa opera đến khán giả đại chúng qua các buổi hòa nhạc và truyền hình.\n\nÔng bắt đầu bằng những vai opera Ý rồi biểu diễn tại các sân khấu lớn như La Scala và Metropolitan Opera. Bài aria 'Nessun dorma' gắn chặt với tên tuổi của ông trong văn hóa đại chúng. Ngoài opera, Pavarotti còn tham gia nhiều hoạt động hòa nhạc gây quỹ nhân đạo.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/luciano-pavoratti-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":21,"name":"George W. Bush","era":"1946–nay","category":"Chính trị & quân sự","wiki":"George_W._Bush","crop":"georgewbush-painting.JPG","uncertain":false,"fullbio":"George W. Bush là tổng thống Mỹ từ 2001 đến 2009. Sau vụ khủng bố 11/9, chính quyền ông phát động cuộc chiến tại Afghanistan và Iraq. Các quyết định này định hình sâu sắc chính sách an ninh và đối ngoại Mỹ đầu thế kỷ XXI. Là con của cựu tổng thống George H. W. Bush, ông làm thống đốc Texas trước khi đắc cử năm 2000. Nhiệm kỳ tổng thống ghi dấu vụ tấn công 11/9, chiến tranh Afghanistan và Iraq, cùng cuộc khủng hoảng tài chính 2008; quyết định đưa quân vào Iraq gây tranh cãi lớn.\n\nSau ngày 11/9/2001, Bush tuyên bố 'cuộc chiến chống khủng bố' và ban hành các chính sách an ninh mới. Cuộc chiến Iraq năm 2003 diễn ra trên những cáo buộc về vũ khí hủy diệt hàng loạt không được xác thực như khẳng định ban đầu. Nhiệm kỳ hai của ông cũng bị thử thách bởi bão Katrina và khủng hoảng tín dụng.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/georgewbush-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":22,"name":"Charles III","era":"1948–nay","category":"Chính trị & quân sự","wiki":"Charles_III","crop":"prince-charles-wales-painting.JPG","uncertain":false,"fullbio":"Charles là người thừa kế ngai vàng Anh trong nhiều thập niên trước khi trở thành vua năm 2022. Ông nổi tiếng từ cuối thế kỷ XX vì các hoạt động môi trường, từ thiện và đời sống hoàng gia. Trong tranh năm 2006, ông được thể hiện khi vẫn là Thái tử Charles. Sinh năm 1948, Charles là người kế vị ngai vàng Anh trong nhiều thập niên và trở thành quốc vương năm 2022. Ông nổi tiếng từ trước khi lên ngôi nhờ các chiến dịch bảo vệ môi trường, kiến trúc, nông nghiệp bền vững và hoạt động từ thiện.\n\nCharles là người thừa kế ngai vàng trong thời gian rất dài, chịu sự chú ý của báo chí về cuộc hôn nhân với Diana và sau đó với Camilla. Ông sáng lập các tổ chức hỗ trợ thanh niên và nông nghiệp bền vững. Khi lên ngôi năm 2022, ông lấy vương hiệu Charles III; hình ông trong tranh được vẽ theo diện mạo thời còn là thái tử.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/prince-charles-wales-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":23,"name":"Liu Xiang – Lưu Tường","era":"1983–nay","category":"Thể thao","wiki":"Liu_Xiang_(hurdler)","crop":"liu-xiang-painting.JPG","uncertain":false,"fullbio":"Lưu Tường là vận động viên điền kinh Trung Quốc nổi lên đầu thế kỷ XXI. Anh giành huy chương vàng 110 mét vượt rào tại Olympic Athens 2004. Thành tích này đưa anh thành ngôi sao thể thao quốc gia và biểu tượng châu Á trong môn chạy vượt rào. Lưu Tường giành huy chương vàng 110 m vượt rào tại Olympic Athens 2004, trở thành biểu tượng điền kinh Trung Quốc. Anh lập kỷ lục thế giới năm 2006; chấn thương gân Achilles khiến các kỳ Olympic sau trở thành trải nghiệm khó khăn.\n\nLưu Tường trở thành vận động viên Trung Quốc đầu tiên giành huy chương vàng Olympic ở nội dung nước rút vượt rào nam. Anh cân bằng kỷ lục thế giới ở chung kết Athens năm 2004 và phá kỷ lục vào năm 2006. Những lần rút lui vì chấn thương tại các kỳ Olympic sau khiến câu chuyện của anh được bàn luận rộng rãi về áp lực thành tích.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/liu-xiang-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":24,"name":"Kofi Annan","era":"1938–2018","category":"Chính trị & quân sự","wiki":"Kofi_Annan","crop":"kofi-annan-painting.JPG","uncertain":false,"fullbio":"Kofi Annan là nhà ngoại giao Ghana, Tổng thư ký Liên Hợp Quốc giai đoạn 1997–2006. Ông thúc đẩy cải tổ Liên Hợp Quốc, gìn giữ hòa bình và hợp tác quốc tế. Ông và Liên Hợp Quốc cùng được trao Nobel Hòa bình năm 2001. Kofi Annan là nhà ngoại giao Ghana trưởng thành qua nhiều vị trí trong hệ thống Liên Hợp Quốc. Trên cương vị Tổng thư ký 1997–2006, ông thúc đẩy cải cách tổ chức, mục tiêu phát triển và gìn giữ hòa bình, đồng thời nhận Nobel Hòa bình năm 2001 cùng Liên Hợp Quốc.\n\nAnnan bắt đầu sự nghiệp lâu năm trong bộ máy Liên Hợp Quốc trước khi trở thành người châu Phi da đen đầu tiên giữ chức Tổng thư ký. Ông cổ vũ phát triển bền vững, quyền con người và đề xuất cải tổ tổ chức. Công tác của LHQ trong các thảm kịch Rwanda và Srebrenica vẫn là phần di sản cần được đánh giá nghiêm túc.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/kofi-annan-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":25,"name":"Zhang Anjun – Trương An Quân","era":"Hoạt động đầu thế kỷ XXI","category":"Tác giả bức tranh","wiki":"Zhang_Anjun","crop":"zhang-an-original-painter.JPG","uncertain":false,"fullbio":"Zhang Anjun là họa sĩ sơn dầu Trung Quốc hoạt động đầu thế kỷ XXI. Ông cùng Dai Dudu và Li Tiezi thực hiện bức tranh này trong năm 2006. Thông tin tiểu sử công khai đáng tin cậy về ông còn khá hạn chế, nên không nên tự gán năm sinh hoặc các giải thưởng. Zhang Anjun là họa sĩ Trung Quốc hoạt động đầu thế kỷ XXI. Ông cùng Dai Dudu và Li Tiezi tham gia tạo bức tranh lịch sử quy mô lớn năm 2006, tác phẩm gây tiếng vang quốc tế khi được cộng đồng mạng giải mã; tư liệu tiểu sử công khai về ông khá hạn chế.\n\nZhang Anjun là một trong ba người cùng xây dựng bố cục và các chân dung của bức tranh 2006. Nhiều tư liệu trực tuyến ghi ông tham gia các hội họa sĩ tại Thẩm Dương, nhưng dữ liệu chi tiết về cuộc đời cá nhân còn ít và không đồng nhất. Ảnh thực tế trong hồ sơ sử dụng ảnh nhóm ba tác giả, chưa khẳng định vị trí từng người.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Li-Tiezi-Zhang-An-Dai-Dudu-Original-Artists-photo.JPG","portrait_src":"ClipTank","photo_group":true,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":26,"name":"Mikhail Gorbachev","era":"1931–2022","category":"Chính trị & quân sự","wiki":"Mikhail_Gorbachev","crop":"mikhail-gorbachev-painting.JPG","uncertain":false,"fullbio":"Gorbachev là lãnh đạo cuối cùng của Liên Xô, lên nắm quyền từ năm 1985. Các chính sách cải tổ perestroika và công khai hóa glasnost góp phần làm thay đổi trật tự Chiến tranh Lạnh. Ông nhận Nobel Hòa bình năm 1990 và gắn với sự tan rã Liên Xô năm 1991. Gorbachev lên nắm quyền Liên Xô năm 1985, đưa ra hai chương trình cải tổ perestroika và glasnost. Những quyết định của ông góp phần giảm đối đầu Đông–Tây và kết thúc Chiến tranh Lạnh, nhưng Liên Xô tan rã vào năm 1991; ông nhận Nobel Hòa bình năm 1990.\n\nCải cách công khai thông tin của Gorbachev cho phép xuất hiện thảo luận chính trị chưa từng có ở Liên Xô cuối thập niên 1980. Ông từ bỏ can thiệp quân sự để duy trì các chính quyền Đông Âu, mở đường cho thay đổi chế độ trong khu vực. Nhiều người phương Tây coi ông là người góp phần kết thúc Chiến tranh Lạnh, trong khi đánh giá ở Nga phức tạp hơn.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/mikhail-gorbachev-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":27,"name":"Li Tiezi – Lý Thiết Tử","era":"Hoạt động đầu thế kỷ XXI","category":"Tác giả bức tranh","wiki":"Li_Tiezi","crop":"original-author-Li-Tiezi.JPG","uncertain":false,"fullbio":"Li Tiezi là họa sĩ sơn dầu Trung Quốc hoạt động đầu thế kỷ XXI. Ông đồng sáng tác Discussing the Divine Comedy with Dante vào năm 2006. Danh tiếng quốc tế của ông chủ yếu gắn với tác phẩm tập hợp hơn 100 hình tượng lịch sử này. Li Tiezi là họa sĩ sơn dầu Trung Quốc gắn với nhóm sáng tác ở Liêu Ninh. Ông đồng thực hiện Discussing the Divine Comedy with Dante, một tác phẩm ghép các chân dung có thật từ nhiều nền văn hóa; thông tin về cuộc đời riêng của ông trên nguồn công khai còn ít.\n\nLi Tiezi đóng góp vào nỗ lực đưa các hình mẫu lịch sử Đông–Tây lên cùng một bề mặt hội họa. Việc ba tác giả phối hợp trong một bức tranh quy mô lớn tạo ra rất nhiều cảnh đối thoại tưởng tượng. Ảnh đời thực hiện có được thể hiện theo ảnh nhóm tác giả công bố trên ClipTank, không suy đoán ai đứng ở vị trí nào.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Li-Tiezi-Zhang-An-Dai-Dudu-Original-Artists-photo.JPG","portrait_src":"ClipTank","photo_group":true,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":28,"name":"Dante Alighieri","era":"khoảng 1265–1321","category":"Văn học & triết học","wiki":"Dante_Alighieri","crop":"dante-painting.JPG","uncertain":false,"fullbio":"Dante là nhà thơ Ý sống vào cuối Trung cổ, thời các thành bang Ý. Ông viết Thần khúc, kể hành trình tưởng tượng qua Địa ngục, Luyện ngục và Thiên đường. Tác phẩm đặt nền móng cho văn học tiếng Ý và chính là nguồn cảm hứng cho nhan đề bức tranh. Dante sống vào giai đoạn chuyển tiếp Trung đại sang Phục hưng tại Firenze, bị lưu đày vì đấu tranh chính trị. Ông viết Thần khúc bằng tiếng Ý bản địa thay vì tiếng Latinh, qua đó ảnh hưởng sâu rộng đến văn học, ngôn ngữ Ý và tư tưởng châu Âu.\n\nDante tham gia sinh hoạt chính trị ở Firenze và bị kết án lưu đày đầu thế kỷ XIV. 'Thần khúc' kể hành trình qua Địa ngục, Luyện ngục và Thiên đường, lồng ghép thần học, đạo đức và bình luận thời cuộc. Nhờ sức ảnh hưởng ngôn ngữ của tác phẩm, Dante được tôn là một trong những người đặt nền móng cho tiếng Ý văn học.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/dante-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":29,"name":"Dai Dudu – Đới Đô Đô","era":"Hoạt động đầu thế kỷ XXI","category":"Tác giả bức tranh","wiki":"Dai_Dudu","crop":"dai-dudu-painting.JPG","uncertain":false,"fullbio":"Dai Dudu là họa sĩ Trung Quốc đến từ Thẩm Dương, tỉnh Liêu Ninh. Ông được ghi nhận là người chủ trì cùng hai đồng nghiệp thực hiện bức tranh trong khoảng mười tháng năm 2006. Tác phẩm gây chú ý rộng rãi trên Internet từ năm 2009 nhờ cách ghép các nhân vật xuyên thời đại. Dai Dudu là họa sĩ Trung Quốc gắn với Viện Mỹ thuật Liêu Ninh, từng giữ vai trò lãnh đạo nghệ thuật tại đây. Ông chủ trì nhóm ba họa sĩ thực hiện tác phẩm trong khoảng mười tháng, nhằm kể lịch sử thế giới thông qua một cuộc gặp tưởng tượng của các danh nhân.\n\nDai Dudu được giới thiệu là họa sĩ tại Liêu Ninh, người chủ trì dự án quy tụ hơn một trăm nhân vật lịch sử. Theo phát biểu được dẫn lại, nhóm muốn người xem có cảm giác lật từng trang sách lịch sử thế giới khi quan sát tác phẩm. Ảnh đối chiếu của nhóm họa sĩ được sử dụng như tư liệu tập thể thay vì gán nhầm khuôn mặt một người.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Li-Tiezi-Zhang-An-Dai-Dudu-Original-Artists-photo.JPG","portrait_src":"ClipTank","photo_group":true,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":30,"name":"Pelé","era":"1940–2022","category":"Thể thao","wiki":"Pelé","crop":"pele-painting.JPG","uncertain":false,"fullbio":"Pelé là cầu thủ bóng đá Brazil nổi bật từ cuối thập niên 1950 đến thập niên 1970. Ông cùng đội tuyển Brazil vô địch World Cup ba lần vào 1958, 1962 và 1970. Tên tuổi Pelé thường được gắn với biệt danh Vua bóng đá. Pelé sinh trong gia đình nghèo ở Brazil và trở thành ngôi sao của Santos từ tuổi thiếu niên. Ông cùng tuyển Brazil vô địch World Cup 1958, 1962 và 1970, là cầu thủ duy nhất đạt ba chức vô địch World Cup nam; tầm ảnh hưởng vượt khỏi sân cỏ.\n\nSinh năm 1940 với tên Edson Arantes do Nascimento, Pelé khoác áo Santos trong phần lớn sự nghiệp trước khi chuyển sang New York Cosmos. Lối chơi kỹ thuật, khả năng ghi bàn và tính sáng tạo khiến ông trở thành biểu tượng quốc tế. Ngoài chuyên môn, Pelé giúp bóng đá Brazil được biết đến rộng khắp các châu lục.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/pele-photo.jpg","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":31,"name":"Quan Vũ","era":"mất năm 220","category":"Chính trị & quân sự","wiki":"Guan_Yu","crop":"guan-yu-painting.JPG","uncertain":false,"fullbio":"Quan Vũ là tướng phục vụ Lưu Bị ở cuối Đông Hán, giai đoạn hình thành thời Tam Quốc. Ông nổi tiếng về lòng trung nghĩa và võ nghệ trong truyền thuyết cùng tiểu thuyết Tam quốc diễn nghĩa. Trong văn hóa Đông Á, Quan Vũ còn được tôn thờ như Quan Công. Quan Vũ phục vụ Lưu Bị trong thời cuối Đông Hán, nổi bật vì năng lực quân sự và lòng trung nghĩa trong truyền thống dân gian. Sau khi qua đời, hình tượng của ông được văn học Tam Quốc diễn nghĩa khuếch đại và nhiều cộng đồng Á Đông thờ phụng như Quan Công.\n\nQuan Vũ là nhân vật lịch sử được ghi chép nhưng hình tượng đại đao, mặt đỏ và nhiều tích truyện đến từ tác phẩm văn học xuất hiện sau nhiều thế kỷ. Ông từng cùng Lưu Bị gây dựng thế lực chống các quân phiệt cuối Đông Hán. Trong tín ngưỡng dân gian, ông tượng trưng cho trung nghĩa, tín nghĩa và được nhiều giới thờ phụng.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/guan-yu-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":32,"name":"Ramesses II","era":"khoảng 1303–1213 TCN","category":"Chính trị & quân sự","wiki":"Ramesses_II","crop":"ramessesII-painting.JPG","uncertain":false,"fullbio":"Ramesses II là pharaoh Ai Cập cổ đại trị vì khoảng thế kỷ XIII trước Công nguyên. Ông tiến hành nhiều chiến dịch quân sự và cho xây dựng các công trình đồ sộ như Abu Simbel. Tên tuổi ông gắn với thời kỳ quyền lực và kiến trúc huy hoàng của Ai Cập cổ đại. Ramesses II trị vì Ai Cập vào thế kỷ XIII TCN và để lại nhiều đền đài, tượng đá đồ sộ, trong đó có Abu Simbel. Ông nổi tiếng với trận Kadesh và hiệp ước hòa bình với người Hittite; các hình tượng về ông chịu ảnh hưởng mạnh của tuyên truyền vương quyền cổ đại.\n\nRamesses II trị vì lâu dài trong thời Tân Vương quốc, giai đoạn Ai Cập duy trì địa vị cường quốc. Ông xây dựng Abu Simbel và nhiều công trình mang hình ảnh bản thân để khẳng định uy quyền. Nhiều bức tượng về ông còn tồn tại, nhưng cần phân biệt hiện vật cổ với chân dung giả định có thể bị lý tưởng hóa.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/ramessesII-statue.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":33,"name":"Charles de Gaulle","era":"1890–1970","category":"Chính trị & quân sự","wiki":"Charles_de_Gaulle","crop":"charles-de-gaulle-painting.JPG","uncertain":false,"fullbio":"De Gaulle là tướng và chính khách Pháp trong thế kỷ XX. Ông lãnh đạo lực lượng Pháp Tự do chống Đức Quốc xã trong Thế chiến II. Sau chiến tranh, ông đóng vai trò nền tảng khi thành lập Đệ ngũ Cộng hòa và trở thành tổng thống Pháp. De Gaulle lãnh đạo phong trào Pháp Tự do từ London sau khi Pháp thất thủ trước Đức năm 1940. Ông trở lại cầm quyền trong khủng hoảng Algeria năm 1958 và xây dựng nền Cộng hòa thứ Năm, qua đó định hình thể chế chính trị Pháp hiện đại.\n\nSau lời kêu gọi kháng chiến năm 1940, de Gaulle tập hợp lực lượng Pháp Tự do và giành vai trò trong phe Đồng minh. Khi trở lại cầm quyền năm 1958, ông tái cấu trúc quyền lực tổng thống và xử lý quá trình phi thực dân hóa Algeria. Chủ trương đối ngoại độc lập giúp nước Pháp giữ vị thế riêng trong Chiến tranh Lạnh.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/charles-de-gaulle-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":34,"name":"Alfred Nobel","era":"1833–1896","category":"Khoa học & kinh doanh","wiki":"Alfred_Nobel","crop":"alfred-nobel-painting.JPG","uncertain":false,"fullbio":"Alfred Nobel là nhà hóa học, phát minh và công nghiệp Thụy Điển sống ở thế kỷ XIX. Ông phát minh dynamite và tích lũy tài sản từ các bằng sáng chế cùng doanh nghiệp. Di chúc của ông dành phần lớn tài sản để thành lập các giải Nobel danh giá. Alfred Nobel là nhà hóa học và công nghiệp Thụy Điển, sở hữu nhiều bằng sáng chế về chất nổ. Ông dành phần lớn tài sản trong di chúc cho các giải thưởng thường niên về khoa học, văn chương và hòa bình, sau được mở rộng thêm giải kinh tế tưởng niệm.\n\nTừng làm việc trong ngành kỹ thuật và hóa học ở nhiều nước, Nobel phát minh dynamite năm 1867, giúp việc xây dựng và khai thác thuận tiện hơn nhưng cũng phục vụ chiến tranh. Di chúc của ông lập ra các giải thưởng đầu tiên trao năm 1901. Giải Nobel không chỉ phản ánh khoa học mà còn ghi nhận văn học, hòa bình và những tranh luận về lựa chọn người đoạt giải.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/alfred-nobel-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":35,"name":"Franklin D. Roosevelt","era":"1882–1945","category":"Chính trị & quân sự","wiki":"Franklin_D._Roosevelt","crop":"fdr-painting.JPG","uncertain":false,"fullbio":"Roosevelt là tổng thống Mỹ từ 1933 đến khi qua đời năm 1945. Ông triển khai Chính sách Mới để đối phó Đại khủng hoảng và lãnh đạo Mỹ phần lớn thời Thế chiến II. Ông là tổng thống Mỹ duy nhất được bầu bốn nhiệm kỳ. Roosevelt điều hành nước Mỹ từ 1933 qua chính sách New Deal nhằm ứng phó Đại khủng hoảng. Ông lãnh đạo Mỹ trong phần lớn Thế chiến II và là tổng thống Mỹ duy nhất đắc cử bốn nhiệm kỳ; chính quyền của ông cũng bị chỉ trích vì việc giam giữ người Mỹ gốc Nhật.\n\nNew Deal của Roosevelt gồm các chương trình việc làm, điều tiết ngân hàng và xây dựng mạng lưới an sinh xã hội. Ông sử dụng các bài phát thanh 'fireside chats' để giải thích chính sách trực tiếp cho dân chúng. Trong Thế chiến II, Roosevelt phối hợp với Churchill và Stalin xây dựng liên minh chống phe Trục.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/fdr-photo.jpg","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":36,"name":"Ernest Hemingway","era":"1899–1961","category":"Văn học & triết học","wiki":"Ernest_Hemingway","crop":"ernest-hemingway-painting.JPG","uncertain":false,"fullbio":"Hemingway là nhà văn Mỹ nổi tiếng trong thế kỷ XX với văn phong cô đọng. Các tác phẩm Giã từ vũ khí và Ông già và biển cả đưa ông thành tên tuổi văn học lớn. Ông đoạt Nobel Văn học năm 1954. Hemingway từng là phóng viên, chứng kiến chiến tranh và sống nhiều năm tại Paris, Tây Ban Nha, Cuba. Văn phong tiết chế của ông ảnh hưởng đến văn học thế kỷ XX; các tác phẩm nổi bật gồm Mặt trời vẫn mọc, Giã từ vũ khí và Ông già và biển cả.\n\nHemingway từng phục vụ đơn vị cứu thương tại Ý trong Thế chiến I và làm phóng viên ở nhiều chiến trường. Kinh nghiệm cá nhân trở thành chất liệu cho các tiểu thuyết viết bằng văn phong cô đọng, nhiều điều không nói thẳng. Ông nhận Pulitzer năm 1953 và Nobel Văn học năm 1954.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/ernest-hemingway-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":37,"name":"Elvis Presley","era":"1935–1977","category":"Âm nhạc & điện ảnh","wiki":"Elvis_Presley","crop":"elvis-presley-painting.JPG","uncertain":false,"fullbio":"Elvis là ca sĩ, diễn viên Mỹ nổi lên giữa thập niên 1950. Ông pha trộn rhythm and blues, country và phong cách biểu diễn mới, góp phần đưa rock and roll đến công chúng đại chúng. Biệt danh Vua Rock and Roll trở thành biểu tượng gắn với tên ông. Elvis trưởng thành tại miền Nam nước Mỹ và bắt đầu thu âm ở Sun Records trong thập niên 1950. Ông hòa trộn country, blues và gospel vào nhạc rock, làm thay đổi văn hóa đại chúng; hàng loạt bài hát và phim giúp ông trở thành biểu tượng toàn cầu.\n\nElvis ký hợp đồng với hãng RCA và trở thành một trong những nghệ sĩ thành công nhất thời kỳ đĩa đơn, truyền hình phát triển. Phong cách biểu diễn của ông gây tranh luận về chuẩn mực giới trẻ và việc tiếp nhận âm nhạc của cộng đồng người Mỹ da đen. Ông qua đời năm 1977, nhưng Graceland và hàng loạt bản thu giữ vai trò biểu tượng của công nghiệp âm nhạc.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/elvis-presley-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":38,"name":"J. Robert Oppenheimer","era":"1904–1967","category":"Khoa học & kinh doanh","wiki":"J._Robert_Oppenheimer","crop":"oppenheimer-painting.JPG","uncertain":false,"fullbio":"Oppenheimer là nhà vật lý lý thuyết Mỹ hoạt động mạnh giữa thế kỷ XX. Ông làm giám đốc khoa học Phòng thí nghiệm Los Alamos trong Dự án Manhattan chế tạo bom nguyên tử. Vai trò của ông mở ra nhiều tranh luận đạo đức về khoa học và vũ khí hạt nhân. Oppenheimer được đào tạo vật lý lý thuyết tại Mỹ và châu Âu trước khi lãnh đạo phòng thí nghiệm Los Alamos trong Dự án Manhattan. Sau chiến tranh, ông vận động kiểm soát vũ khí hạt nhân nhưng bị tước quyền tiếp cận bí mật an ninh năm 1954 trong bầu không khí chống cộng.\n\nOppenheimer học tại Harvard, Cambridge và Göttingen trước khi trở thành nhà nghiên cứu vật lý lý thuyết xuất sắc. Vụ thử Trinity tháng 7/1945 mở đầu kỷ nguyên vũ khí hạt nhân. Sau chiến tranh, ông cổ vũ kiểm soát vũ khí và bị tước quyền tiếp cận bí mật an ninh năm 1954 trong thời kỳ chống cộng ở Mỹ.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/oppenheimer-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":39,"name":"William Shakespeare","era":"1564–1616","category":"Văn học & triết học","wiki":"William_Shakespeare","crop":"shakespeare-painting.JPG","uncertain":false,"fullbio":"Shakespeare là nhà viết kịch và thi sĩ Anh ở thời Elizabeth và James I. Ông sáng tác Hamlet, Macbeth, Romeo và Juliet cùng nhiều vở kịch được biểu diễn khắp thế giới. Khả năng khắc họa tâm lý và ngôn ngữ khiến ông thành một trụ cột của văn học Anh. Shakespeare sinh tại Stratford-upon-Avon, trở thành diễn viên và tác giả tại London thời Elizabeth I và James I. Ông sáng tác nhiều bi kịch, hài kịch và sonnet, với những vở như Hamlet, King Lear và Romeo and Juliet vẫn được diễn khắp thế giới.\n\nShakespeare viết và diễn kịch trong thời Elizabeth I và James I, hoạt động cùng đoàn kịch King's Men. Các bi kịch lớn như 'Hamlet', 'Othello', 'King Lear' và 'Macbeth' đào sâu quyền lực, tình yêu, ghen tuông và đạo đức. Tác phẩm của ông được diễn và dịch liên tục suốt nhiều thế kỷ.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/shakespeare-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":40,"name":"Wolfgang Amadeus Mozart","era":"1756–1791","category":"Âm nhạc & điện ảnh","wiki":"Wolfgang_Amadeus_Mozart","crop":"mozart-painting.JPG","uncertain":false,"fullbio":"Mozart là nhà soạn nhạc Áo sống cuối thế kỷ XVIII, thuộc thời kỳ Cổ điển. Ông sáng tác từ nhỏ và để lại hàng trăm tác phẩm giao hưởng, hòa tấu, thính phòng và opera. Những tác phẩm như The Magic Flute và Requiem vẫn được trình diễn rộng rãi. Mozart là thần đồng âm nhạc Salzburg, lưu diễn châu Âu từ nhỏ rồi phát triển sự nghiệp tại Vienna. Ông sáng tác ở hầu hết thể loại lớn của nhạc cổ điển, nổi bật với The Marriage of Figaro, Don Giovanni và Requiem còn dang dở.\n\nMozart bộc lộ năng khiếu từ thời thơ ấu, lưu diễn trước các triều đình châu Âu cùng gia đình. Ông để lại những opera như 'The Marriage of Figaro', 'Don Giovanni' và 'The Magic Flute', bên cạnh nhiều giao hưởng và concerto. Dù nổi danh, ông trải qua khó khăn tài chính trong những năm cuối đời và mất năm 1791 khi 35 tuổi.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/mozart-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":41,"name":"Steven Spielberg","era":"1946–nay","category":"Âm nhạc & điện ảnh","wiki":"Steven_Spielberg","crop":"steven-spielberg-painting.JPG","uncertain":false,"fullbio":"Spielberg là đạo diễn, nhà sản xuất Mỹ nổi lên từ thập niên 1970. Các phim Jaws, E.T., Jurassic Park và Schindler's List cho thấy khả năng kết hợp giải trí đại chúng với câu chuyện lịch sử. Ông nằm trong số các nhà làm phim có ảnh hưởng nhất Hollywood. Spielberg bắt đầu làm phim từ sớm và giúp định hình mô hình bom tấn Hollywood qua Jaws và E.T. Các tác phẩm như Schindler’s List và Saving Private Ryan cho thấy khả năng kết hợp điện ảnh giải trí với các chủ đề lịch sử nặng ký.\n\nSpielberg gây đột phá thương mại với 'Jaws' năm 1975, góp phần hình thành mô hình phim bom tấn mùa hè. Ông kết hợp điện ảnh giải trí như 'E.T.' với các phim lịch sử như 'Schindler's List' và 'Saving Private Ryan'. Những tác phẩm này mang về nhiều giải Oscar và định hình cách kể chuyện của Hollywood hiện đại.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/steven-spielberg-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":42,"name":"Pablo Picasso","era":"1881–1973","category":"Nghệ thuật & kiến trúc","wiki":"Pablo_Picasso","crop":"pablo-picaso-painting.JPG","uncertain":false,"fullbio":"Picasso là họa sĩ và nhà điêu khắc Tây Ban Nha có ảnh hưởng sâu rộng tới nghệ thuật thế kỷ XX. Ông cùng Georges Braque phát triển trường phái Lập thể, phá vỡ cách mô tả không gian truyền thống. Guernica là một tác phẩm nổi tiếng của ông về nỗi kinh hoàng chiến tranh. Picasso sinh ở Málaga, Tây Ban Nha, phần lớn sự nghiệp gắn với Paris. Cùng Georges Braque, ông phát triển hội họa Lập thể; những tác phẩm như Les Demoiselles d’Avignon và Guernica tạo ảnh hưởng rất lớn đến nghệ thuật hiện đại.\n\nPicasso trải qua nhiều giai đoạn sáng tác, từ thời kỳ Xanh, Hồng đến lập thể và hội họa biểu hiện. Ông cùng Georges Braque phát triển cách nhìn hình thể từ nhiều góc độ trong một tác phẩm. 'Guernica' năm 1937 là bức tranh phản chiến nổi tiếng gắn với nội chiến Tây Ban Nha.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/pablo-picaso-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":43,"name":"Marie Curie","era":"1867–1934","category":"Khoa học & kinh doanh","wiki":"Marie_Curie","crop":"marie-painting.JPG","uncertain":false,"fullbio":"Marie Curie là nhà vật lý, hóa học gốc Ba Lan làm việc tại Pháp vào cuối thế kỷ XIX và đầu thế kỷ XX. Bà tiên phong nghiên cứu phóng xạ và cùng chồng phát hiện các nguyên tố polonium, radium. Bà là người đầu tiên nhận hai giải Nobel ở hai ngành khoa học khác nhau. Marie Curie sinh ở Warszawa rồi tới Paris học và nghiên cứu vật lý, hóa học. Bà cùng Pierre Curie phát hiện polonium, radium và trở thành người đầu tiên giành hai Nobel ở hai ngành khoa học khác nhau, đồng thời thúc đẩy ứng dụng tia X trong chiến tranh.\n\nMarie Curie sinh tại Ba Lan dưới tên Maria Skłodowska rồi sang Paris học tập và nghiên cứu. Cùng Pierre Curie, bà phát hiện polonium và radium; nhận Nobel Vật lý năm 1903 và Nobel Hóa học năm 1911. Bà còn tổ chức xe X-quang lưu động trong Thế chiến I, nhưng sức khỏe bị ảnh hưởng bởi phơi nhiễm phóng xạ kéo dài.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/marie-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":44,"name":"Chu Ân Lai","era":"1898–1976","category":"Chính trị & quân sự","wiki":"Zhou_Enlai","crop":"zhou-enlai-painting.JPG","uncertain":false,"fullbio":"Chu Ân Lai là nhà cách mạng, chính khách Trung Quốc trong thế kỷ XX. Ông là thủ tướng đầu tiên của nước Cộng hòa Nhân dân Trung Hoa từ năm 1949. Ông nổi tiếng về ngoại giao và vai trò trong các cuộc tiếp xúc Mỹ–Trung đầu thập niên 1970. Chu Ân Lai tham gia phong trào cộng sản Trung Quốc và trở thành thủ tướng từ năm 1949 cho đến khi mất. Ông đóng vai trò lớn trong ngoại giao thời Mao, bao gồm cải thiện quan hệ Trung–Mỹ đầu thập niên 1970, nhưng hoạt động trong bộ máy của một thời kỳ biến động dữ dội.\n\nChu Ân Lai là nhà ngoại giao quan trọng trong quá trình hình thành và củng cố nước Trung Quốc mới. Ông tham dự Hội nghị Bandung năm 1955, góp phần tạo quan hệ với các quốc gia Á–Phi. Trong nội trị, ông hoạt động bên cạnh Mao Trạch Đông qua những giai đoạn biến động lớn, bao gồm Cách mạng Văn hóa.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/zhou-enlai-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":45,"name":"Johann Wolfgang von Goethe","era":"1749–1832","category":"Văn học & triết học","wiki":"Johann_Wolfgang_von_Goethe","crop":"johann-wolfgang-von-goethe-painting.JPG","uncertain":false,"fullbio":"Goethe là nhà văn, thi sĩ và nhà tư tưởng Đức ở thế kỷ XVIII–XIX. Tác phẩm Faust cùng Nỗi đau của chàng Werther có ảnh hưởng rất lớn tới văn học châu Âu. Ông cũng nghiên cứu khoa học tự nhiên và tham gia hoạt động quản lý nhà nước. Goethe hoạt động trong phong trào Sturm und Drang và sau đó là chủ nghĩa cổ điển Weimar. Tác phẩm Faust, Nỗi đau của chàng Werther và các nghiên cứu khoa học khiến ông trở thành một nhân vật đa lĩnh vực tiêu biểu của văn hóa Đức.\n\nGoethe là tác giả kiệt tác 'Faust', câu chuyện về khát vọng tri thức, quyền lực và cái giá của lựa chọn con người. Ngoài văn chương, ông tham gia chính quyền Weimar và nghiên cứu thực vật học, màu sắc. Ảnh hưởng của ông đối với văn học và tư tưởng Đức kéo dài vượt qua phong trào Lãng mạn.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/johann-wolfgang-von-goethe-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":46,"name":"Lão Tử","era":"Thường gắn với Trung Hoa cổ đại","category":"Triết học & tôn giáo","wiki":"Laozi","crop":"Laozi-painting.JPG","uncertain":false,"fullbio":"Lão Tử là nhân vật triết học Trung Hoa cổ đại gắn với truyền thống Đạo gia. Tác phẩm Đạo đức kinh được quy cho ông nhưng niên đại và thân thế lịch sử vẫn có tranh luận. Tư tưởng về Đạo, vô vi và sự thuận tự nhiên ảnh hưởng rộng khắp Đông Á. Tác giả Đạo Đức Kinh theo truyền thống được gọi là Lão Tử; sử liệu về việc ông có thật hay sống vào thời điểm nào không thống nhất. Tư tưởng vô vi, thuận theo Đạo có ảnh hưởng rộng đến triết học, tôn giáo và văn hóa Trung Hoa.\n\nCác ghi chép truyền thống đặt Lão Tử vào khoảng thế kỷ VI TCN, nhưng thời gian sống và mức độ tồn tại lịch sử thực tế vẫn được giới nghiên cứu tranh luận. 'Đạo Đức Kinh' đề cập Đạo, đức, tự nhiên và nguyên tắc vô vi. Đạo gia trở thành một dòng tư tưởng lớn ở Đông Á, ảnh hưởng đến triết học, tôn giáo và nghệ thuật.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Laozi-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":47,"name":"Marilyn Monroe","era":"1926–1962","category":"Âm nhạc & điện ảnh","wiki":"Marilyn_Monroe","crop":"marilyn-painting.JPG","uncertain":false,"fullbio":"Marilyn Monroe là nữ diễn viên, người mẫu Mỹ nổi tiếng trong thập niên 1950. Cô đóng các phim Gentlemen Prefer Blondes và Some Like It Hot, trở thành biểu tượng của Hollywood. Cuộc đời và cái chết ở tuổi 36 khiến hình ảnh của cô tiếp tục được nhắc đến. Marilyn Monroe lớn lên trong hoàn cảnh khó khăn, khởi nghiệp người mẫu rồi thành minh tinh điện ảnh Mỹ thập niên 1950. Các phim Gentlemen Prefer Blondes và Some Like It Hot đưa bà thành biểu tượng sắc đẹp và danh tiếng, nhưng cuộc sống cá nhân nhiều bất ổn.\n\nMarilyn Monroe khởi nghiệp người mẫu rồi được Hollywood xây dựng hình ảnh ngôi sao gợi cảm trong thập niên 1950. Bà có những vai đáng chú ý trong 'Gentlemen Prefer Blondes' và 'Some Like It Hot', đồng thời đấu tranh để được nhìn nhận như diễn viên nghiêm túc. Qua đời năm 1962 ở tuổi 36, bà vẫn là biểu tượng của danh vọng và áp lực truyền thông.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/marilyn-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":48,"name":"Salvador Dalí","era":"1904–1989","category":"Nghệ thuật & kiến trúc","wiki":"Salvador_Dalí","crop":"salvador-dali-painting.JPG","uncertain":false,"fullbio":"Dalí là họa sĩ Tây Ban Nha nổi tiếng trong phong trào Siêu thực thế kỷ XX. Những khung cảnh mộng mị và đồng hồ tan chảy trong The Persistence of Memory trở thành hình ảnh đặc trưng. Ông còn gây chú ý bởi phong cách cá nhân và hoạt động nghệ thuật đa dạng. Dalí là nghệ sĩ Tây Ban Nha nổi tiếng với hình ảnh siêu thực, kỹ thuật vẽ tỉ mỉ và phong cách tự quảng bá khác thường. Bức The Persistence of Memory với những đồng hồ mềm là tác phẩm tiêu biểu, phản ánh hứng thú với giấc mơ và tiềm thức.\n\nDalí gắn với tranh siêu thực và các hình tượng phi lý, nổi tiếng nhất là đồng hồ mềm trong 'The Persistence of Memory'. Ông áp dụng kỹ thuật vẽ tả thực tỉ mỉ để mô tả giấc mơ và hình ảnh tiềm thức. Phong cách cá nhân khác thường cũng khiến Dalí trở thành một nhân vật truyền thông nổi tiếng.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/salvador-dali-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":49,"name":"Từ Hy Thái hậu","era":"1835–1908","category":"Chính trị & quân sự","wiki":"Empress_Dowager_Cixi","crop":"dowager-painting.JPG","uncertain":false,"fullbio":"Từ Hy là nhân vật quyền lực của triều Thanh ở nửa sau thế kỷ XIX. Bà nắm quyền nhiếp chính trong thời kỳ Trung Quốc chịu sức ép ngày càng lớn từ các cường quốc. Vai trò của bà trong cải cách và bảo thủ triều đình tiếp tục được giới sử học tranh luận. Từ Hy bắt đầu là phi tần rồi trở thành người nắm thực quyền triều Thanh trong nhiều thập niên cuối thế kỷ XIX. Bà đối diện với sức ép phương Tây, biến động nội bộ và nỗ lực cải cách gây tranh cãi; các nhận định lịch sử về vai trò của bà rất khác nhau.\n\nTừ Hy bước vào hậu cung nhà Thanh và dần trở thành người nhiếp chính quyền lực sau khi Hoàng đế Hàm Phong qua đời. Bà chi phối các quyết định chính trị cuối thế kỷ XIX trong bối cảnh sức ép từ các cường quốc phương Tây. Các đánh giá hiện đại phân biệt vai trò thực tế của bà với hình ảnh cực đoan do truyền thuyết và tuyên truyền để lại.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/dowager-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":50,"name":"Ariel Sharon","era":"1928–2014","category":"Chính trị & quân sự","wiki":"Ariel_Sharon","crop":"ariel-sharon-painting.JPG","uncertain":false,"fullbio":"Sharon là tướng và chính khách Israel có ảnh hưởng trong nửa sau thế kỷ XX. Ông từng giữ nhiều chức vụ quân sự và làm thủ tướng Israel từ 2001 đến 2006. Các chính sách an ninh và kế hoạch rút khỏi Gaza khiến ông vừa được ủng hộ vừa bị chỉ trích. Ariel Sharon là vị tướng Israel có vai trò lớn trong các cuộc xung đột Trung Đông, sau trở thành chính trị gia cánh hữu. Với tư cách thủ tướng 2001–2006, ông thực hiện kế hoạch rút các khu định cư Israel khỏi Dải Gaza năm 2005; quá khứ quân sự của ông vẫn gây tranh cãi.\n\nSharon xuất thân quân đội Israel, từng chỉ huy trong các cuộc chiến khu vực trước khi chuyển sang chính trị. Khi làm thủ tướng từ năm 2001, ông lựa chọn đường lối an ninh cứng rắn nhưng cũng chỉ đạo rút các khu định cư Israel khỏi Dải Gaza năm 2005. Hoạt động quân sự và chính sách của ông là chủ đề tranh luận sâu sắc.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/ariel-sharon-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":51,"name":"Tề Bạch Thạch","era":"1864–1957","category":"Nghệ thuật & kiến trúc","wiki":"Qi_Baishi","crop":"qi-baishi-painting.JPG","uncertain":false,"fullbio":"Tề Bạch Thạch là họa sĩ Trung Quốc sống qua cuối nhà Thanh và thế kỷ XX. Ông nổi tiếng với tranh thủy mặc giản dị, sinh động về tôm, cua, hoa, chim và đời sống thường ngày. Phong cách riêng giúp ông trở thành một đại diện nổi bật của hội họa Trung Quốc hiện đại. Tề Bạch Thạch xuất thân từ nghề mộc, tự học hội họa và trở thành danh họa Trung Quốc thế kỷ XX. Ông đặc biệt nổi tiếng với tranh thủy mặc tôm, cua, hoa và chim, kết hợp bút pháp truyền thống với sự giản dị và sinh động.\n\nTề Bạch Thạch xuất thân từ nghề mộc ở Trung Quốc, sau đó phát triển nghệ thuật thư pháp, khắc dấu và tranh thủy mặc. Ông nổi tiếng với những hình tượng đời thường như tôm, cua, hoa và chim. Ngôn ngữ hội họa của ông giản dị mà tinh tế, được giới sưu tập quốc tế đánh giá cao.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/qi-baishi-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":52,"name":"Tần Thủy Hoàng","era":"259–210 TCN","category":"Chính trị & quân sự","wiki":"Qin_Shi_Huang","crop":"Qin%20Shi%20Huang%20Photo.JPG","uncertain":false,"fullbio":"Tần Thủy Hoàng là vị hoàng đế đầu tiên thống nhất Trung Hoa năm 221 trước Công nguyên. Ông chuẩn hóa một số hệ thống chữ viết, đo lường và tổ chức hành chính. Lăng mộ cùng đội quân đất nung và chính sách cai trị hà khắc khiến ông nổi tiếng trong lịch sử. Doanh Chính thống nhất các nước chư hầu năm 221 TCN và xưng Tần Thủy Hoàng, mở đầu chế độ hoàng đế Trung Hoa. Ông chuẩn hóa chữ viết, tiền tệ và đo lường, cho xây lăng mộ với đội quân đất nung; cai trị tập quyền nghiêm khắc tạo hậu quả nặng nề.\n\nTần Thủy Hoàng sinh vào thời Chiến Quốc, lên ngôi nước Tần trước khi chinh phục sáu nước lớn còn lại. Ông chuẩn hóa chữ viết, tiền tệ, đơn vị đo lường và thúc đẩy hệ thống đường sá; nhiều chính sách được thi hành bằng biện pháp hà khắc. Lăng mộ với đội quân đất nung là một trong những phát hiện khảo cổ quan trọng nhất Trung Quốc.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Qin%20Shi%20Huang%20Painting.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":53,"name":"Mẹ Teresa","era":"1910–1997","category":"Triết học & tôn giáo","wiki":"Mother_Teresa","crop":"mother-teresa-painting.JPG","uncertain":false,"fullbio":"Mẹ Teresa là nữ tu Công giáo sinh tại Skopje, hoạt động chủ yếu ở Ấn Độ thế kỷ XX. Bà sáng lập Dòng Thừa sai Bác ái để chăm sóc người nghèo, bệnh nhân và người hấp hối. Bà nhận Nobel Hòa bình năm 1979; phương pháp chăm sóc của tổ chức cũng từng chịu phê bình. Sinh tại Skopje, Anjezë Gonxhe Bojaxhiu gia nhập đời sống tu trì và lập Dòng Thừa sai Bác ái tại Calcutta. Bà được Nobel Hòa bình năm 1979 nhờ công việc chăm sóc người nghèo và người hấp hối; phương pháp hoạt động của dòng cũng từng bị phê bình.\n\nMẹ Teresa sinh tại vùng Balkan, gia nhập đời sống tu trì và chuyển đến Ấn Độ làm việc. Bà thành lập Dòng Thừa sai Bác ái năm 1950, chăm sóc người nghèo và người bệnh tại Kolkata. Bà nhận Nobel Hòa bình năm 1979, được Giáo hội Công giáo phong thánh năm 2016; chất lượng chăm sóc và một số quan điểm của bà cũng chịu phê bình.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/mother-teresa-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":54,"name":"Tống Khánh Linh","era":"1893–1981","category":"Chính trị & quân sự","wiki":"Soong_Ching-ling","crop":"soong-ching-ling-photo.JPG","uncertain":false,"fullbio":"Tống Khánh Linh là chính khách Trung Quốc ở thế kỷ XX và là vợ của Tôn Trung Sơn. Bà có ảnh hưởng trong phong trào chính trị Trung Hoa và tham gia nhiều hoạt động xã hội, trẻ em. Sau năm 1949, bà đảm nhận các vai trò cấp cao trong nhà nước Trung Quốc. Tống Khánh Linh là người vợ thứ hai của Tôn Trung Sơn, hoạt động tích cực trong phong trào chính trị và phúc lợi trẻ em Trung Quốc. Bà được trao nhiều chức vụ danh dự cao cấp của CHND Trung Hoa và là một biểu tượng kết nối lịch sử dân quốc với thời cộng hòa nhân dân.\n\nTống Khánh Linh là vợ của Tôn Trung Sơn và một trong ba chị em họ Tống có ảnh hưởng sâu sắc ở Trung Quốc thế kỷ XX. Bà hoạt động vì phúc lợi trẻ em, y tế và các phong trào xã hội. Sau năm 1949, bà giữ những vị trí danh dự quan trọng trong hệ thống chính trị Trung Quốc.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/soong-ching-ling-painting.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":55,"name":"Rabindranath Tagore","era":"1861–1941","category":"Văn học & triết học","wiki":"Rabindranath_Tagore","crop":"saint-peter-painting.JPG","uncertain":false,"fullbio":"Tagore là thi sĩ, nhà văn và nhạc sĩ Bengal hoạt động cuối thế kỷ XIX, đầu XX. Ông nhận Nobel Văn học năm 1913, trở thành người châu Á đầu tiên đoạt giải này. Ông còn có đóng góp cho giáo dục và văn hóa Ấn Độ thông qua trường Santiniketan. Tagore là nhà văn Bengal, sáng tác thơ, nhạc, truyện và tiểu luận trong thời Ấn Độ thuộc Anh. Ông nhận Nobel Văn học năm 1913, người châu Á đầu tiên được vinh danh ở giải này; ông còn thành lập cơ sở giáo dục Visva-Bharati.\n\nTagore sinh tại Bengal, viết thơ, nhạc, tiểu thuyết và tham gia đổi mới giáo dục Ấn Độ. Tập thơ 'Gitanjali' giúp ông trở thành người châu Á đầu tiên nhận Nobel Văn học năm 1913. Ông sáng lập trường học phát triển thành Đại học Visva-Bharati và sáng tác ca khúc được dùng làm quốc ca Ấn Độ và Bangladesh.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Rabindranath-Tagore.jpg","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":56,"name":"Otto von Bismarck","era":"1815–1898","category":"Chính trị & quân sự","wiki":"Otto_von_Bismarck","crop":"Otto%20von%20Bismarck-p.JPG","uncertain":false,"fullbio":"Bismarck là chính khách Phổ và Đức nổi bật ở thế kỷ XIX. Bằng ngoại giao và các cuộc chiến tranh thống nhất, ông góp phần thành lập Đế quốc Đức năm 1871. Ông giữ chức thủ tướng đế quốc và được gọi là Thủ tướng Sắt. Bismarck làm thủ tướng Phổ và dẫn dắt các cuộc chiến tranh thống nhất nước Đức năm 1871. Trên cương vị thủ tướng Đế quốc Đức, ông tổ chức ngoại giao cân bằng quyền lực và mở đầu các chương trình bảo hiểm xã hội quan trọng, song đàn áp nhiều lực lượng đối lập.\n\nBismarck là thủ tướng nước Phổ rồi trở thành thủ tướng đầu tiên của Đế quốc Đức thống nhất năm 1871. Ông sử dụng ngoại giao và chiến tranh với Đan Mạch, Áo và Pháp để điều chỉnh cán cân quyền lực châu Âu. Ông cũng xây dựng các hệ thống bảo hiểm xã hội sớm ở Đức, trong khi trấn áp nhiều lực lượng đối lập chính trị.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Otto%20von%20Bismarck.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":57,"name":"Run Run Shaw","era":"1907–2014","category":"Âm nhạc & điện ảnh","wiki":"Run_Run_Shaw","crop":"run%20run%20shaw.JPG","uncertain":false,"fullbio":"Run Run Shaw là doanh nhân điện ảnh và truyền hình Hồng Kông hoạt động mạnh trong thế kỷ XX. Ông đồng sáng lập Shaw Brothers và góp phần phát triển hệ thống sản xuất phim Hoa ngữ quy mô lớn. Quỹ từ thiện mang tên ông cũng tài trợ nhiều công trình giáo dục và y tế. Run Run Shaw là doanh nhân giải trí gốc Ninh Ba, lập nghiệp trong ngành điện ảnh tại Đông Nam Á và Hồng Kông. Shaw Brothers tạo ra nhiều phim võ hiệp kinh điển; ông cũng tham gia phát triển truyền hình TVB và quyên góp lớn cho giáo dục, y tế.\n\nRun Run Shaw khởi nghiệp với hoạt động phát hành phim ở Đông Nam Á trước khi xây dựng hãng Shaw Brothers tại Hồng Kông. Những phim võ thuật, cổ trang và truyền hình do ông hỗ trợ có ảnh hưởng lớn đến văn hóa đại chúng châu Á. Ông còn nổi tiếng vì các khoản hiến tặng cho giáo dục và y tế.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/run%20run%20chore%20photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":58,"name":"Jean-Jacques Rousseau","era":"1712–1778","category":"Văn học & triết học","wiki":"Jean-Jacques_Rousseau","crop":"jean-jacques%20rousseau.JPG","uncertain":false,"fullbio":"Rousseau là triết gia và nhà văn sinh tại Genève, hoạt động ở châu Âu thế kỷ XVIII. Tác phẩm Khế ước xã hội bàn về chủ quyền nhân dân và nền tảng quyền lực chính trị. Ông có ảnh hưởng sâu sắc đến tư tưởng Khai sáng, giáo dục và Cách mạng Pháp. Rousseau là nhà tư tưởng Geneva hoạt động chủ yếu trong không gian văn hóa Pháp thế kỷ XVIII. Ông viết Khế ước xã hội và Émile, nhấn mạnh chủ quyền nhân dân và giáo dục; tư tưởng của ông ảnh hưởng đến Cách mạng Pháp và triết học hiện đại.\n\nRousseau sinh tại Geneva và viết về nguồn gốc bất bình đẳng, giáo dục và tính chính đáng của quyền lực. 'Khế ước xã hội' nêu ý tưởng chủ quyền thuộc về nhân dân; 'Émile' thảo luận phương pháp giáo dục dựa vào sự phát triển của trẻ. Tư tưởng của ông ảnh hưởng sâu tới Cách mạng Pháp và triết học chính trị hiện đại.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/jean-jacques%20rousseau-p.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":59,"name":"Audrey Hepburn","era":"1929–1993","category":"Âm nhạc & điện ảnh","wiki":"Audrey_Hepburn","crop":"audery-hepburn-painting.JPG","uncertain":false,"fullbio":"Audrey Hepburn là diễn viên sinh tại Bỉ, nổi tiếng tại Hollywood từ thập niên 1950. Các vai diễn trong Roman Holiday và Breakfast at Tiffany's biến bà thành biểu tượng điện ảnh và thời trang. Cuối đời, bà làm đại sứ thiện chí của UNICEF giúp đỡ trẻ em. Audrey Hepburn sinh tại Bỉ, trải qua Thế chiến II ở Hà Lan rồi bước vào sân khấu và Hollywood. Bà giành Oscar với Roman Holiday, nổi tiếng với Breakfast at Tiffany’s và dành những năm cuối đời làm đại sứ thiện chí UNICEF.\n\nAudrey Hepburn từng trải qua thời niên thiếu khó khăn ở châu Âu trong Thế chiến II. Vai diễn 'Roman Holiday' đem lại Oscar Nữ diễn viên chính, còn 'Breakfast at Tiffany's' giúp bà trở thành biểu tượng thời trang điện ảnh. Những năm cuối đời, bà tích cực tham gia công tác nhân đạo cho UNICEF.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/audery-hepburn.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":60,"name":"Ludwig van Beethoven","era":"1770–1827","category":"Âm nhạc & điện ảnh","wiki":"Ludwig_van_Beethoven","crop":"beethoven-painting.JPG","uncertain":false,"fullbio":"Beethoven là nhà soạn nhạc người Đức hoạt động đầu thế kỷ XIX. Các bản giao hưởng số 5, số 9 và sonata piano của ông đánh dấu bước chuyển từ Cổ điển sang Lãng mạn. Ông tiếp tục sáng tác nhiều tác phẩm lớn dù bị suy giảm thính lực nghiêm trọng. Beethoven sinh ở Bonn và hoạt động tại Vienna vào giai đoạn cuối Cổ điển đầu Lãng mạn. Dù mất thính lực ngày càng nặng, ông vẫn sáng tác các giao hưởng nổi tiếng, đặc biệt Giao hưởng số 9 với phần hợp xướng Ode to Joy.\n\nBeethoven sinh ở Bonn, chuyển đến Vienna và nổi danh với những bản sonata, concerto và giao hưởng. Ông bắt đầu mất thính lực từ cuối tuổi hai mươi nhưng tiếp tục sáng tác các tác phẩm mang tính cách tân. Giao hưởng số 9 với phần 'Ode to Joy' trở thành biểu tượng văn hóa châu Âu.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/beethoven-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":61,"name":"Adolf Hitler","era":"1889–1945","category":"Chính trị & quân sự","wiki":"Adolf_Hitler","crop":"hitler-painting.JPG","uncertain":false,"fullbio":"Hitler là nhà độc tài Đức Quốc xã từ 1933 đến 1945. Chính sách xâm lược của chế độ ông châm ngòi Thế chiến II tại châu Âu. Chế độ này thực hiện Holocaust, giết hại khoảng sáu triệu người Do Thái cùng hàng triệu nạn nhân khác. Hitler là lãnh đạo Đảng Quốc xã, nắm quyền tại Đức năm 1933 rồi thiết lập chế độ độc tài chủng tộc. Chính sách bành trướng của ông góp phần châm ngòi Thế chiến II ở châu Âu; chế độ Quốc xã thực hiện Holocaust sát hại khoảng sáu triệu người Do Thái và đàn áp, sát hại nhiều nhóm khác.\n\nHitler lên nắm quyền ở Đức năm 1933, xóa bỏ nền dân chủ Weimar và thiết lập nhà nước độc tài Quốc xã. Chính quyền của ông phát động Thế chiến II tại châu Âu bằng cuộc xâm lược Ba Lan năm 1939 và tổ chức diệt chủng người Do Thái cùng nhiều nhóm khác. Ông tự sát năm 1945 khi Đức thất bại; tên tuổi gắn với những tội ác nghiêm trọng nhất của thế kỷ XX.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/hitler-photo.jpg","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":62,"name":"Benito Mussolini","era":"1883–1945","category":"Chính trị & quân sự","wiki":"Benito_Mussolini","crop":"mussolini-painting.JPG","uncertain":false,"fullbio":"Mussolini là nhà độc tài Ý cầm quyền từ 1922 đến 1943. Ông xây dựng chủ nghĩa phát xít, triệt tiêu đối lập chính trị và theo đuổi chính sách bành trướng. Ý dưới thời ông liên minh với Đức Quốc xã trong Thế chiến II. Mussolini hình thành và lãnh đạo phong trào phát xít Ý, lên làm thủ tướng năm 1922 và từng bước thủ tiêu dân chủ nghị viện. Chế độ của ông gây chiến tại Ethiopia, liên minh với Hitler và sụp đổ trong Thế chiến II.\n\nMussolini xây dựng phong trào phát xít Ý sau Thế chiến I, đưa lực lượng của mình tiến vào Rome năm 1922. Chế độ của ông đàn áp đối lập và tham gia xâm lược Ethiopia năm 1935, sau đó liên minh với Đức Quốc xã. Ông bị lật đổ rồi bị lực lượng kháng chiến xử tử năm 1945.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/mussolini-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":63,"name":"Saddam Hussein","era":"1937–2006","category":"Chính trị & quân sự","wiki":"Saddam_Hussein","crop":"saddam-hussein-painting.JPG","uncertain":false,"fullbio":"Saddam Hussein là tổng thống Iraq từ 1979 đến 2003. Chế độ của ông gắn với đàn áp chính trị, chiến tranh Iran–Iraq và cuộc xâm lược Kuwait năm 1990. Ông bị lật đổ sau cuộc chiến Iraq năm 2003 và bị xử tử năm 2006. Saddam Hussein lên nắm quyền năm 1979, thiết lập chế độ độc tài Baath ở Iraq. Ông tiến hành chiến tranh với Iran, xâm lược Kuwait và sử dụng bạo lực đối với các cộng đồng trong nước; chính quyền ông bị lật đổ sau cuộc xâm lược Iraq năm 2003.\n\nSaddam Hussein nắm quyền tuyệt đối tại Iraq từ năm 1979, quản lý đất nước bằng hệ thống đàn áp và sùng bái cá nhân. Dưới thời ông diễn ra chiến tranh Iran–Iraq và cuộc xâm lược Kuwait năm 1990. Sau cuộc xâm lược Iraq của Mỹ năm 2003, ông bị bắt, xét xử và xử tử năm 2006.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/saddam-hussein-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":64,"name":"Maxim Gorky","era":"1868–1936","category":"Văn học & triết học","wiki":"Maxim_Gorky","crop":"marktwain-gorky-painting.JPG","uncertain":false,"fullbio":"Gorky là nhà văn Nga nổi tiếng đầu thế kỷ XX. Ông viết tiểu thuyết Người mẹ và các tác phẩm về tầng lớp lao động, nghèo khổ. Tên tuổi ông gắn với văn học hiện thực xã hội chủ nghĩa và đời sống trí thức thời Liên Xô đầu tiên. Gorky lớn lên trong nghèo khó ở Nga và đưa trải nghiệm lao động vào các tác phẩm văn học hiện thực. Ông gắn bó phức tạp với cách mạng Nga, viết Người mẹ và góp phần định hình văn học hiện thực xã hội chủ nghĩa tại Liên Xô.\n\nGorky lớn lên trong hoàn cảnh nghèo khó, làm nhiều nghề trước khi nổi danh nhờ truyện ngắn và tiểu thuyết. Các tác phẩm như 'Những người dưới đáy' và 'Người mẹ' mô tả đời sống tầng lớp lao động. Ông tham gia nhiều hoạt động chính trị, trở thành một trong các gương mặt lớn của văn học Nga gắn với thời kỳ Xô viết.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/maxim-gorgky-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":65,"name":"Tôn Trung Sơn","era":"1866–1925","category":"Chính trị & quân sự","wiki":"Sun_Yat-sen","crop":"sun-yat-sen-painting.JPG","uncertain":false,"fullbio":"Tôn Trung Sơn là nhà cách mạng Trung Quốc hoạt động cuối nhà Thanh và đầu thế kỷ XX. Ông đóng vai trò biểu tượng trong Cách mạng Tân Hợi năm 1911 và sự ra đời Trung Hoa Dân Quốc. Học thuyết Tam dân của ông có ảnh hưởng lớn đến tư tưởng chính trị Trung Quốc. Tôn Trung Sơn là bác sĩ và nhà hoạt động cách mạng chống triều Thanh, đóng vai trò biểu tượng trong cuộc Cách mạng Tân Hợi 1911. Chủ nghĩa Tam dân của ông đề cập dân tộc, dân quyền, dân sinh; cả hai chính quyền ở hai bờ eo biển Đài Loan đều xem ông là nhân vật khai quốc quan trọng.\n\nTôn Trung Sơn được đào tạo ngành y và dành phần lớn cuộc đời tổ chức phong trào chống nhà Thanh. Cách mạng Tân Hợi năm 1911 kết thúc chế độ quân chủ kéo dài nhiều thiên niên kỷ ở Trung Quốc. Học thuyết Tam dân gồm dân tộc, dân quyền, dân sinh để lại ảnh hưởng chính trị sâu rộng, dù ông không sống đến khi Trung Quốc thống nhất.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/sun-yat-sen-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":66,"name":"Đặng Tiểu Bình","era":"1904–1997","category":"Chính trị & quân sự","wiki":"Deng_Xiaoping","crop":"deng-xiaoping-painting.JPG","uncertain":false,"fullbio":"Đặng Tiểu Bình là nhà lãnh đạo Trung Quốc có ảnh hưởng sau thời Mao Trạch Đông. Từ cuối thập niên 1970, ông thúc đẩy cải cách kinh tế và mở cửa với đầu tư nước ngoài. Ông cũng là nhân vật quyền lực trong giai đoạn đàn áp biểu tình Thiên An Môn năm 1989. Đặng Tiểu Bình trở thành lãnh đạo có ảnh hưởng nhấ
