t Trung Quốc từ cuối thập niên 1970 dù không luôn giữ chức vụ cao nhất. Ông thúc đẩy mở cửa kinh tế, đặc khu và chuyển đổi thị trường; đồng thời chính quyền dưới ảnh hưởng của ông đàn áp các cuộc biểu tình Thiên An Môn năm 1989.\n\nĐặng Tiểu Bình được xem là kiến trúc sư các chính sách 'cải cách và mở cửa' bắt đầu từ năm 1978. Việc cho phép kinh tế thị trường vận hành ở nhiều lĩnh vực giúp Trung Quốc tăng trưởng nhanh trong nhiều thập niên. Cùng lúc, cách xử lý phong trào Thiên An Môn năm 1989 là phần di sản gây tranh cãi sâu sắc.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/deng-xiaoping-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":67,"name":"Alexander Pushkin","era":"1799–1837","category":"Văn học & triết học","wiki":"Alexander_Pushkin","crop":"alexander-pushkin-painting.JPG","uncertain":false,"fullbio":"Pushkin là nhà thơ và nhà văn Nga nửa đầu thế kỷ XIX. Các tác phẩm như Eugene Onegin tạo ảnh hưởng nền tảng lên ngôn ngữ văn học Nga hiện đại. Ông qua đời sau một cuộc đấu súng ở tuổi 37. Pushkin là thi sĩ và nhà văn Nga đầu thế kỷ XIX, nhiều lần chịu giám sát và lưu đày vì những tác phẩm mang tinh thần tự do. Tiểu thuyết bằng thơ Eugene Onegin và truyện Con gái viên đại úy cho thấy ảnh hưởng lớn của ông đối với tiếng Nga văn học.\n\nPushkin trưởng thành trong tầng lớp quý tộc Nga đầu thế kỷ XIX, từng bị giám sát vì tư tưởng tự do. Ông viết 'Eugene Onegin', 'Boris Godunov' và nhiều bài thơ có ảnh hưởng đến ngôn ngữ văn chương Nga hiện đại. Ông mất năm 1837 sau một cuộc đấu súng ở tuổi 37.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/alexander-pushkin-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":68,"name":"Lỗ Tấn","era":"1881–1936","category":"Văn học & triết học","wiki":"Lu_Xun","crop":"lu-xun-painting.JPG","uncertain":false,"fullbio":"Lỗ Tấn là nhà văn Trung Quốc nổi tiếng đầu thế kỷ XX. Truyện ngắn Nhật ký người điên và AQ chính truyện phê phán xã hội và tâm lý phong kiến. Ông được xem là một người mở đường quan trọng cho văn học Trung Quốc hiện đại. Lỗ Tấn từng học y tại Nhật Bản rồi chuyển sang viết văn vì cho rằng cần thay đổi nhận thức xã hội. Nhật ký người điên và AQ chính truyện phê phán lối tư duy phong kiến, trở thành cột mốc văn học Trung Quốc viết bằng bạch thoại.\n\nLỗ Tấn từng học y ở Nhật Bản nhưng chuyển sang viết văn vì tin rằng thay đổi tinh thần xã hội cấp bách hơn. 'Nhật ký người điên' và 'AQ chính truyện' phê phán hủ tục, bất bình đẳng và tâm lý xã hội. Ông trở thành biểu tượng của phong trào văn hóa mới Trung Quốc đầu thế kỷ XX.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/lu-xun-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":69,"name":"Joseph Stalin","era":"1878–1953","category":"Chính trị & quân sự","wiki":"Joseph_Stalin","crop":"joseph-stalin-painting.JPG","uncertain":false,"fullbio":"Stalin là nhà lãnh đạo Liên Xô nắm quyền từ cuối thập niên 1920 đến 1953. Ông thúc đẩy công nghiệp hóa và lãnh đạo Liên Xô trong chiến thắng Đức Quốc xã ở Thế chiến II. Chế độ của ông đồng thời thực hiện thanh trừng, cưỡng bức tập thể hóa và đàn áp làm nhiều người thiệt mạng. Stalin củng cố quyền lực sau khi Lenin mất và điều hành Liên Xô từ cuối thập niên 1920 đến 1953. Công nghiệp hóa cưỡng bức, tập thể hóa nông nghiệp, Đại thanh trừng và hệ thống trại lao động gây tổn thất nhân mạng lớn, dù Liên Xô giữ vai trò then chốt trong chiến thắng Đức Quốc xã.\n\nSau khi củng cố quyền lực, Stalin triển khai công nghiệp hóa và tập thể hóa nông nghiệp cưỡng bức trên quy mô lớn. Các cuộc thanh trừng, trại lao động Gulag và nạn đói gây tổn thất nhân mạng nghiêm trọng. Liên Xô giữ vai trò quyết định trong chiến thắng Đức Quốc xã, nhưng di sản Stalin phải được đánh giá cùng những vi phạm nhân quyền của chế độ.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/joseph-stalin-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":70,"name":"Leonardo da Vinci","era":"1452–1519","category":"Nghệ thuật & kiến trúc","wiki":"Leonardo_da_Vinci","crop":"leonardo-painting.JPG","uncertain":false,"fullbio":"Leonardo da Vinci là danh họa và nhà nghiên cứu Ý thời Phục hưng. Ông vẽ Mona Lisa, Bữa ăn tối cuối cùng và để lại nhiều sổ tay về giải phẫu, cơ khí, tự nhiên. Sự kết hợp nghệ thuật với quan sát khoa học khiến ông trở thành hình mẫu con người toàn năng thời Phục hưng. Leonardo hoạt động trong các triều đình và thành phố Ý thời Phục hưng. Ngoài Mona Lisa và Bữa ăn tối cuối cùng, ông để lại sổ ghi chép về giải phẫu, cơ khí, thủy lực và bay lượn, tượng trưng cho trí tuệ đa ngành.\n\nLeonardo vừa sáng tác các bức tranh nổi tiếng như 'Bữa ăn tối cuối cùng' và 'Mona Lisa', vừa ghi chép hàng nghìn trang về giải phẫu, cơ học, nước và chuyến bay. Ông quan sát thực nghiệm với mức độ hiếm thấy ở thời Phục hưng. Nhiều ý tưởng kỹ thuật của ông không thành máy móc hoàn chỉnh, nhưng cho thấy tinh thần nghiên cứu liên ngành đặc biệt.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/leonardo-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":71,"name":"Karl Marx","era":"1818–1883","category":"Văn học & triết học","wiki":"Karl_Marx","crop":"karl-marx-painting.JPG","uncertain":false,"fullbio":"Marx là nhà triết học và kinh tế chính trị người Đức sống ở thế kỷ XIX. Ông cùng Friedrich Engels viết Tuyên ngôn của Đảng Cộng sản và phát triển phê phán chủ nghĩa tư bản. Bộ Tư bản và các tư tưởng của ông ảnh hưởng mạnh tới các phong trào xã hội chủ nghĩa toàn cầu. Marx là triết gia và nhà kinh tế chính trị Đức sống phần lớn cuộc đời lưu vong ở London. Ông cùng Friedrich Engels viết Tuyên ngôn của Đảng Cộng sản và là tác giả Tư bản, phân tích quan hệ lao động và tư bản; tư tưởng Marx tạo ảnh hưởng chính trị toàn cầu.\n\nMarx cùng Friedrich Engels xuất bản 'Tuyên ngôn của Đảng Cộng sản' năm 1848. Bộ sách 'Tư bản' phân tích sản xuất hàng hóa, lao động, tư bản và các mâu thuẫn trong nền kinh tế công nghiệp. Tư tưởng của Marx ảnh hưởng đến phong trào công nhân, khoa học xã hội và nhiều chính quyền thế kỷ XX, đồng thời tạo ra những tranh luận học thuật sâu rộng.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/karl-marx-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":72,"name":"Friedrich Nietzsche","era":"1844–1900","category":"Văn học & triết học","wiki":"Friedrich_Nietzsche","crop":"Friedrich%20Nietzsche%20Painting.JPG","uncertain":false,"fullbio":"Nietzsche là triết gia Đức cuối thế kỷ XIX. Ông phê phán đạo đức truyền thống và bàn về ý chí quyền lực, siêu nhân và sự khủng hoảng giá trị. Những tác phẩm như Zarathustra đã nói như thế tác động lớn đến triết học và văn học thế kỷ XX. Nietzsche từ chức giáo sư ngữ văn cổ điển vì sức khỏe và dành nhiều năm viết triết học độc lập. Qua Thus Spoke Zarathustra và Beyond Good and Evil, ông chất vấn đạo đức, tôn giáo và chân lý truyền thống, ảnh hưởng sâu rộng đến triết học thế kỷ XX.\n\nNietzsche khởi đầu là nhà ngữ văn cổ điển rồi tập trung vào triết học về đạo đức, văn hóa và giá trị con người. Các tác phẩm như 'Thus Spoke Zarathustra' và 'Beyond Good and Evil' bàn về ý chí quyền lực, sự sáng tạo giá trị và phê phán chuẩn mực truyền thống. Những diễn giải tư tưởng của ông từng bị lạm dụng, cần tách khỏi nội dung nguyên gốc.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Friedrich%20Nietzsche%20Photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":73,"name":"Abraham Lincoln","era":"1809–1865","category":"Chính trị & quân sự","wiki":"Abraham_Lincoln","crop":"abe-lincoln-painting.JPG","uncertain":false,"fullbio":"Lincoln là tổng thống thứ 16 của Mỹ, lãnh đạo đất nước trong Nội chiến 1861–1865. Ông ban hành Tuyên ngôn Giải phóng và thúc đẩy Tu chính án thứ 13 bãi bỏ chế độ nô lệ. Ông bị ám sát năm 1865 và được nhớ đến như một biểu tượng của sự thống nhất nước Mỹ. Lincoln lớn lên trong gia đình nghèo, tự học luật và trở thành tổng thống Mỹ năm 1861 giữa khủng hoảng chia rẽ. Ông lãnh đạo phe Liên bang trong Nội chiến, ban hành Tuyên ngôn Giải phóng Nô lệ và thúc đẩy Tu chính án 13; ông bị ám sát năm 1865.\n\nLincoln xuất thân nghèo khó, tự học luật rồi trở thành chính trị gia đảng Cộng hòa. Tuyên ngôn Giải phóng Nô lệ năm 1863 và Tu chính án thứ 13 gắn với chấm dứt chế độ nô lệ tại Mỹ. Ông bị ám sát năm 1865, chỉ ít ngày sau khi Nội chiến kết thúc, và trở thành biểu tượng đoàn kết quốc gia.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/abe-lincoln-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":74,"name":"Mao Trạch Đông","era":"1893–1976","category":"Chính trị & quân sự","wiki":"Mao_Zedong","crop":"mao-zedong-painting.JPG","uncertain":false,"fullbio":"Mao Trạch Đông là lãnh đạo Đảng Cộng sản Trung Quốc và là nhân vật trung tâm khi thành lập nước CHND Trung Hoa năm 1949. Ông lãnh đạo những biến chuyển sâu rộng của đất nước trong thế kỷ XX. Đại Nhảy vọt và Cách mạng Văn hóa dưới thời ông gây tổn thất xã hội và nhân mạng nghiêm trọng. Mao lãnh đạo Đảng Cộng sản Trung Quốc trong nội chiến, tuyên bố thành lập CHND Trung Hoa năm 1949. Các chiến dịch Đại Nhảy Vọt và Cách mạng Văn hóa gây hậu quả xã hội, nhân mạng nghiêm trọng, khiến di sản của ông vừa rất lớn vừa gây tranh cãi sâu sắc.\n\nMao Trạch Đông đóng vai trò chủ chốt trong cuộc trường chinh của Hồng quân và chiến thắng của lực lượng cộng sản năm 1949. Các chiến dịch Đại Nhảy Vọt và Cách mạng Văn hóa gây biến động xã hội cùng tổn thất nhân mạng rất lớn. Di sản của ông ở Trung Quốc vẫn gắn với cả việc lập quốc lẫn hậu quả nghiêm trọng của các chiến dịch chính trị.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/mao-zedong-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":75,"name":"Charlie Chaplin","era":"1889–1977","category":"Âm nhạc & điện ảnh","wiki":"Charlie_Chaplin","crop":"charilie-chaplin-painting.JPG","uncertain":false,"fullbio":"Chaplin là diễn viên và đạo diễn gốc Anh nổi tiếng toàn cầu thời phim câm đầu thế kỷ XX. Nhân vật người lang thang với mũ quả dưa và cây gậy trở thành biểu tượng điện ảnh. Các phim Modern Times và The Great Dictator kết hợp hài hước với phê phán xã hội. Chaplin trưởng thành từ sân khấu tạp kỹ nước Anh rồi nổi danh tại Hollywood thời phim câm. Nhân vật The Tramp với mũ quả dưa và gậy chống xuất hiện trong các phim như City Lights, Modern Times; The Great Dictator châm biếm chủ nghĩa phát xít.\n\nChaplin sáng tạo nhân vật 'The Tramp' với mũ quả dưa, cây gậy và phong cách hài kết hợp cảm xúc nhân văn. 'Modern Times' phê phán áp lực của xã hội công nghiệp, còn 'The Great Dictator' công kích chủ nghĩa phát xít. Ông là một trong những người làm phim có ảnh hưởng nhất giai đoạn điện ảnh câm chuyển sang phim có tiếng.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/charilie-chaplin-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":76,"name":"Henry Ford","era":"1863–1947","category":"Khoa học & kinh doanh","wiki":"Henry_Ford","crop":"henry-ford-painting.JPG","uncertain":false,"fullbio":"Henry Ford là nhà công nghiệp Mỹ nổi bật đầu thế kỷ XX. Ông sáng lập Ford Motor Company và mở rộng ứng dụng dây chuyền lắp ráp để sản xuất ô tô đại trà. Xe Model T góp phần thay đổi giao thông và cách tổ chức sản xuất công nghiệp. Henry Ford xây dựng Ford Motor Company và giới thiệu Model T năm 1908, biến ô tô thành phương tiện phổ thông hơn. Dây chuyền lắp ráp giúp hạ giá thành mạnh, nhưng tư tưởng bài Do Thái ông từng truyền bá là một phần tối trong di sản.\n\nFord không phát minh ô tô, nhưng cải tiến sản xuất hàng loạt với dây chuyền lắp ráp di động cho mẫu Model T. Phương thức này giảm giá thành xe và thay đổi việc làm trong công nghiệp. Ông đưa ra mức lương 5 USD/ngày nổi tiếng năm 1914, nhưng cũng để lại di sản gây tranh cãi vì quan điểm bài Do Thái.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/henry-ford-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":77,"name":"Lôi Phong","era":"1940–1962","category":"Chính trị & quân sự","wiki":"Lei_Feng","crop":"lei-feng.JPG","uncertain":false,"fullbio":"Lôi Phong là một quân nhân Trung Quốc qua đời năm 1962. Sau khi mất, ông được truyền thông nhà nước đề cao như hình mẫu sống giản dị và giúp đỡ người khác. Chiến dịch Học tập Lôi Phong bắt đầu từ năm 1963 khiến tên tuổi ông trở nên quen thuộc tại Trung Quốc. Lôi Phong là một người lính Trung Quốc chết năm 1962, sau đó được truyền thông nhà nước xây dựng thành tấm gương tận tụy, tiết kiệm và giúp đỡ người khác. Chiến dịch Học tập Lôi Phong do Mao phát động năm 1963 đưa tên ông vào giáo dục và văn hóa chính trị.\n\nLôi Phong là một quân nhân trẻ tử nạn năm 1962, sau đó được chính quyền Trung Quốc xây dựng thành hình mẫu tận tụy vì tập thể. Phong trào 'Học tập Lôi Phong' bắt đầu năm 1963 và lặp lại trong các chiến dịch giáo dục đạo đức. Nhiều câu chuyện, nhật ký liên quan đến nhân vật này được nghiên cứu như một phần của lịch sử tuyên truyền.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/lei-feng-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":78,"name":"Norman Bethune","era":"1890–1939","category":"Khoa học & kinh doanh","wiki":"Norman_Bethune","crop":"jonas-salk-painting.JPG","uncertain":false,"fullbio":"Norman Bethune là bác sĩ Canada hoạt động trong những cuộc chiến ở thập niên 1930. Ông tổ chức cấp cứu và truyền máu cho thương binh tại Tây Ban Nha, sau đó sang Trung Quốc hỗ trợ lực lượng chống Nhật. Ông đặc biệt nổi tiếng trong lịch sử y tế Trung Quốc nhờ bài viết tưởng niệm của Mao Trạch Đông. Norman Bethune sinh tại Ontario, tham gia điều trị chiến trường trong Nội chiến Tây Ban Nha và Chiến tranh Trung–Nhật. Ông tiên phong dịch vụ truyền máu lưu động và chết vì nhiễm trùng khi làm việc tại Trung Quốc; Mao viết bài tưởng niệm khiến ông được biết đến rộng rãi.\n\nNorman Bethune nổi tiếng vì tổ chức chăm sóc y tế và tiếp máu trên chiến trường trong Nội chiến Tây Ban Nha. Năm 1938, ông sang Trung Quốc, hoạt động trong các đơn vị kháng chiến chống Nhật và huấn luyện nhân viên y tế. Ông qua đời năm 1939 do nhiễm trùng khi điều trị thương binh; tên tuổi được ghi nhớ rộng rãi ở Trung Quốc.","portrait":"https://commons.wikimedia.org/wiki/Special:FilePath/Norman%20Bethune%201928.jpg?width=480","portrait_src":"Wikimedia Commons","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":79,"name":"Sigmund Freud","era":"1856–1939","category":"Khoa học & kinh doanh","wiki":"Sigmund_Freud","crop":"sigmund-freud-painting.JPG","uncertain":false,"fullbio":"Freud là bác sĩ thần kinh người Áo, hoạt động cuối thế kỷ XIX đầu thế kỷ XX. Ông phát triển phân tâm học với các khái niệm vô thức, xung đột tâm lý và giải thích giấc mơ. Dù nhiều luận điểm khoa học bị phê phán, tác động văn hóa và lịch sử của ông rất lớn. Freud là bác sĩ thần kinh làm việc tại Vienna trước khi phải chạy khỏi Đức Quốc xã sang London. Ông phát triển lý thuyết vô thức, giấc mơ và xung đột tâm lý; dù nhiều khái niệm bị tâm lý học thực nghiệm hiện đại chất vấn, ảnh hưởng văn hóa vẫn rất lớn.\n\nFreud làm việc trong bối cảnh Vienna cuối thế kỷ XIX, điều trị những bệnh nhân có triệu chứng tâm lý và phát triển lý thuyết vô thức. Các khái niệm giấc mơ, xung đột tâm lý và cơ chế phòng vệ có ảnh hưởng sâu tới văn hóa đại chúng. Nhiều giả thuyết của ông ngày nay bị phê bình vì khó kiểm chứng bằng phương pháp khoa học hiện đại.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/sigmund-freud-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":80,"name":"Jack Kevorkian (có nguồn ghi Samaranch)","era":"1928–2011","category":"Khoa học & kinh doanh","wiki":"Jack_Kevorkian","crop":"jack-kevorkian-painting.JPG","uncertain":true,"fullbio":"Jack Kevorkian là bác sĩ giải phẫu bệnh Mỹ gây tranh cãi cuối thế kỷ XX. Ông nổi tiếng vì công khai hỗ trợ những người bệnh muốn tự kết thúc cuộc đời và vận động cho quyền được chết. Một số danh sách lại nhận diện khuôn mặt này là Juan Antonio Samaranch, nên vị trí trong tranh chưa được xác nhận thống nhất. Kevorkian là bác sĩ bệnh học Mỹ, được truyền thông gọi là Dr. Death vì công khai hỗ trợ người bệnh kết thúc đời sống. Các vụ án của ông gây tranh luận về quyền tự quyết và đạo đức y khoa; tuy nhiên danh tính khuôn mặt này trong tranh vẫn có nguồn gán là Juan Antonio Samaranch.\n\nKevorkian là bác sĩ giải phẫu bệnh người Mỹ công khai ủng hộ quyền quyết định thời điểm kết thúc sự sống của bệnh nhân. Hoạt động hỗ trợ tự sát của ông dẫn đến nhiều vụ truy tố và một bản án hình sự năm 1999. Trường hợp này trở thành tâm điểm tranh luận về tự chủ bệnh nhân, chăm sóc giảm nhẹ và ranh giới đạo đức – pháp lý.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/jack-kevorkian-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":81,"name":"Tưởng Giới Thạch","era":"1887–1975","category":"Chính trị & quân sự","wiki":"Chiang_Kai-shek","crop":"Chiang-Kai-shek-painting.JPG","uncertain":false,"fullbio":"Tưởng Giới Thạch là nhà lãnh đạo Quốc dân đảng Trung Quốc trong thế kỷ XX. Ông đứng đầu chính quyền Trung Hoa Dân Quốc trong thời kỳ chiến tranh chống Nhật và nội chiến với phe cộng sản. Sau năm 1949, ông cùng chính quyền Quốc dân đảng chuyển sang Đài Loan. Tưởng Giới Thạch là lãnh đạo Quốc dân đảng, nắm quyền ở Trung Hoa Dân Quốc qua những cuộc chiến chống Nhật và nội chiến với cộng sản. Sau thất bại năm 1949, ông chuyển chính phủ sang Đài Loan, cai trị trong thời kỳ thiết quân luật kéo dài.\n\nTưởng Giới Thạch giữ vai trò lãnh đạo Quốc dân đảng sau khi Tôn Trung Sơn qua đời. Ông chỉ huy nhiều chiến dịch quân sự, chống Nhật trong Thế chiến II và chiến đấu với Đảng Cộng sản trong Nội chiến Trung Quốc. Sau thất bại năm 1949, ông chuyển chính quyền Trung Hoa Dân Quốc đến Đài Loan và duy trì chế độ thiết quân luật.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Chiang-Kai-shek-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":82,"name":"Nữ hoàng Elizabeth II","era":"1926–2022","category":"Chính trị & quân sự","wiki":"Elizabeth_II","crop":"Elizabeth-II-painting.JPG","uncertain":false,"fullbio":"Elizabeth II là nữ hoàng Anh và nhiều quốc gia thuộc Khối Thịnh vượng chung từ 1952 đến 2022. Bà chứng kiến thời kỳ phi thực dân hóa và nhiều biến đổi xã hội sâu rộng. Thời gian trị vì 70 năm khiến bà trở thành một trong những quân chủ nổi tiếng nhất thế kỷ XX và XXI. Elizabeth II lên ngôi năm 1952 và trị vì đến năm 2022, trong thời kỳ đế quốc Anh chuyển thành khối các quốc gia độc lập. Bà giữ vai trò nguyên thủ theo chế độ quân chủ lập hiến, nổi tiếng nhờ sự bền bỉ trong bổn phận công chúng và tính biểu tượng của hoàng gia.\n\nElizabeth II lên ngôi năm 1952 sau khi vua George VI qua đời và được đăng quang năm 1953. Triều đại của bà trải qua quá trình phi thực dân hóa, thay đổi sâu sắc của Khối Thịnh vượng chung và sự phát triển của truyền thông đại chúng. Bà qua đời năm 2022, người kế vị là con trai Charles III.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Elizabeth-II-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":83,"name":"Lev Tolstoy","era":"1828–1910","category":"Văn học & triết học","wiki":"Leo_Tolstoy","crop":"leo-tolstoy-painting.JPG","uncertain":false,"fullbio":"Tolstoy là nhà văn Nga sống ở thế kỷ XIX và đầu XX. Hai tiểu thuyết Chiến tranh và hòa bình và Anna Karenina được xem là đỉnh cao của văn học hiện thực. Ông còn phát triển các quan điểm đạo đức về bất bạo động và đời sống giản dị. Tolstoy là bá tước Nga từng tham gia quân đội, sau đó trở thành nhà văn lớn của chủ nghĩa hiện thực. Chiến tranh và hòa bình và Anna Karenina phân tích xã hội Nga sâu sắc; về cuối đời ông theo chủ nghĩa bất bạo động, ảnh hưởng đến Gandhi.\n\nTolstoy sinh trong gia đình quý tộc Nga, từng phục vụ quân đội trước khi viết các tiểu thuyết vĩ đại. 'Chiến tranh và hòa bình' tái hiện nước Nga thời Napoleon, còn 'Anna Karenina' phân tích tình yêu, gia đình và đạo đức. Cuối đời, ông phát triển tư tưởng đạo đức bất bạo động có ảnh hưởng tới Gandhi và nhiều nhà hoạt động xã hội.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/leo-tolstoy-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":84,"name":"Lý Bạch","era":"701–762","category":"Văn học & triết học","wiki":"Li_Bai","crop":"li%20bai%20p.JPG","uncertain":false,"fullbio":"Lý Bạch là đại thi hào Trung Quốc thời nhà Đường, thế kỷ VIII. Thơ ông nổi bật với trí tưởng tượng phóng khoáng, thiên nhiên, rượu và nỗi nhớ quê. Cùng Đỗ Phủ, ông được xem là một trong những nhà thơ quan trọng nhất lịch sử Trung Hoa. Lý Bạch sống thời thịnh Đường ở Trung Quốc, nổi tiếng với trí tưởng tượng, ngôn từ phóng khoáng và các bài thơ về thiên nhiên, rượu, ly biệt. Ông cùng Đỗ Phủ là hai đỉnh cao thơ Đường, được hậu thế gọi là Thi tiên.\n\nLý Bạch sống vào thời thịnh Đường, đi nhiều nơi và viết về thiên nhiên, tình bạn, rượu cùng lý tưởng tự do. Thơ ông nổi tiếng với trí tưởng tượng phóng khoáng và hình ảnh giàu nhạc tính. Dù được gọi là 'Thi tiên', những chi tiết về cuộc đời ông có phần pha trộn truyền thuyết và tư liệu lịch sử.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/li%20bai%20ph.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":85,"name":"Corneliu Baba","era":"1906–1997","category":"Nghệ thuật & kiến trúc","wiki":"Corneliu_Baba","crop":"corneliu-baba-p.JPG","uncertain":false,"fullbio":"Corneliu Baba là họa sĩ Romania sống và sáng tác trong thế kỷ XX. Ông nổi tiếng với tranh chân dung, tranh nhân vật và cách xử lý ánh sáng giàu cảm xúc. Tác phẩm của ông tạo dấu ấn riêng trong hội họa Đông Âu. Corneliu Baba là họa sĩ Romania thế kỷ XX, nổi tiếng với chân dung sắc sảo và các sáng tác có chiều sâu tâm lý. Ông giảng dạy mỹ thuật, để lại ảnh hưởng lớn đến hội họa hiện đại Romania; những bức chân dung tự họa là điểm nổi bật.\n\nCorneliu Baba sống và làm việc tại Romania thế kỷ XX, nổi tiếng với chân dung và những bức tranh đời thường đầy biểu cảm. Ông sử dụng ánh sáng tối, nét cọ nặng và bố cục kịch tính để mô tả số phận con người. Sự nghiệp của ông trải qua những thay đổi chính trị lớn của Đông Âu.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/corneliu-baba.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":86,"name":"Aristotle (có nguồn ghi Rodin)","era":"384–322 TCN","category":"Triết học & tư tưởng","wiki":"Aristotle","crop":"aristotle-p.JPG","uncertain":true,"fullbio":"Aristotle là triết gia Hy Lạp cổ đại sống trong thế kỷ IV trước Công nguyên. Ông là học trò của Plato và về sau là thầy của Alexander Đại đế. Các tác phẩm của ông trải rộng từ logic, đạo đức, chính trị đến sinh học và nghiên cứu tự nhiên. Aristotle trở thành một trong những nhân vật nền tảng của tư tưởng phương Tây.\n\nAristotle sinh tại Stagira, học với Plato ở Athens và sau này dạy Alexander Đại đế. Ông sáng lập trường Lyceum, biên soạn công trình về logic, sinh học, vật lý, thi ca và chính trị. Các phân loại và phương pháp lập luận của ông định hình đời sống học thuật châu Âu và Trung Đông hơn hai thiên niên kỷ; ảnh được dùng là tượng hoặc hình dựng hậu thế.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/aristotle.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":87,"name":"Dwight D. Eisenhower","era":"1890–1969","category":"Chính trị & quân sự","wiki":"Dwight_D._Eisenhower","crop":"dwight-d-eisenhower-p.JPG","uncertain":false,"fullbio":"Eisenhower là tướng Mỹ nổi tiếng trong Thế chiến II. Ông làm chỉ huy tối cao lực lượng Đồng minh tại châu Âu và giữ vai trò quan trọng trong cuộc đổ bộ Normandy năm 1944. Sau chiến tranh, ông trở thành tổng thống Mỹ từ 1953 đến 1961. Eisenhower là tướng Mỹ giữ vị trí Tổng tư lệnh lực lượng Đồng minh tại Tây Âu trong Thế chiến II, giám sát cuộc đổ bộ Normandy năm 1944. Sau chiến tranh ông làm tổng thống Mỹ 1953–1961, thời kỳ phát triển mạng lưới đường cao tốc liên bang và căng thẳng Chiến tranh Lạnh.\n\nEisenhower chỉ huy lực lượng Đồng minh trong chiến dịch đổ bộ Normandy năm 1944, góp phần giải phóng Tây Âu khỏi Đức Quốc xã. Sau chiến tranh, ông trở thành tổng thống Mỹ từ năm 1953 đến 1961, điều hành giai đoạn đầu Chiến tranh Lạnh. Ông thúc đẩy hệ thống xa lộ liên bang và cảnh báo về ảnh hưởng của tổ hợp công nghiệp – quân sự khi rời nhiệm sở.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/dwight-d-eisenhower.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":88,"name":"Michael Jordan","era":"1963–nay","category":"Thể thao","wiki":"Michael_Jordan","crop":"michael-jordan-p.JPG","uncertain":false,"fullbio":"Michael Jordan là huyền thoại bóng rổ Mỹ nổi lên ở NBA từ thập niên 1980. Ông cùng Chicago Bulls giành sáu chức vô địch NBA trong thập niên 1990. Phong cách thi đấu và thương hiệu Air Jordan đưa ông thành biểu tượng thể thao toàn cầu. Michael Jordan nổi lên tại University of North Carolina rồi trở thành ngôi sao Chicago Bulls từ năm 1984. Ông giành sáu chức vô địch NBA và năm giải MVP mùa thường, giúp bóng rổ NBA phát triển thành hiện tượng toàn cầu.\n\nMichael Jordan nổi danh với Chicago Bulls trong thập niên 1990, giành sáu chức vô địch NBA cùng đội bóng. Anh được biết đến nhờ khả năng ghi điểm, phòng ngự và tinh thần cạnh tranh. Thương hiệu Air Jordan giúp ảnh hưởng của anh vượt ra ngoài thể thao sang thời trang và kinh doanh toàn cầu.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/michael-jordan.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":89,"name":"Hideki Tojo","era":"1884–1948","category":"Chính trị & quân sự","wiki":"Hideki_Tojo","crop":"tojo-painting.JPG","uncertain":false,"fullbio":"Hideki Tojo là tướng và thủ tướng Nhật Bản trong phần lớn Thế chiến II, từ 1941 đến 1944. Ông giữ vai trò chủ chốt trong chính phủ quân phiệt thời Nhật Bản mở rộng chiến tranh. Sau chiến tranh, ông bị xét xử và xử tử vì tội ác chiến tranh. Hideki Tojo là tướng và thủ tướng Nhật Bản từ 1941 đến 1944 trong giai đoạn nước này mở rộng chiến tranh tại châu Á–Thái Bình Dương. Sau Thế chiến II, ông bị Tòa án Quân sự Quốc tế vùng Viễn Đông kết án tội ác chiến tranh và xử tử năm 1948.\n\nHideki Tojo xuất thân quân đội Nhật, trở thành thủ tướng khi Nhật mở rộng chiến tranh ở châu Á–Thái Bình Dương. Ông tại vị trong thời kỳ Nhật tấn công Trân Châu Cảng năm 1941 và tham chiến với Mỹ. Sau chiến tranh, Tojo bị xét xử tại Tòa án Quân sự Quốc tế Viễn Đông và bị hành quyết năm 1948.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/tojo-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":90,"name":"Michelangelo","era":"1475–1564","category":"Nghệ thuật & kiến trúc","wiki":"Michelangelo","crop":"michelangelo-p.JPG","uncertain":false,"fullbio":"Michelangelo là nhà điêu khắc, họa sĩ và kiến trúc sư Ý thời Phục hưng. Ông tạc tượng David, Pietà và vẽ trần Nhà nguyện Sistine tại Vatican. Năng lực sáng tạo vượt nhiều lĩnh vực khiến ông trở thành một thiên tài nghệ thuật châu Âu. Michelangelo sinh tại vùng Tuscany và tạo dựng sự nghiệp tại Firenze, Rome thời Phục hưng. Ông điêu khắc Pietà và David, vẽ trần Nhà nguyện Sistine và tham gia thiết kế Vương cung thánh đường Thánh Peter; danh tiếng bao trùm hội họa, điêu khắc, kiến trúc.\n\nMichelangelo hoạt động trong thời Phục hưng Ý, sáng tác tượng 'David', 'Pietà' và tranh trần Nhà nguyện Sistine. Ông còn tham gia thiết kế kiến trúc Vương cung thánh đường Thánh Phêrô tại Rome. Ông được coi là một trong những nghệ sĩ đạt đỉnh cao về giải phẫu tạo hình và năng lực thể hiện cảm xúc con người.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/michelangelo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":91,"name":"Lưu Bị (có nguồn ghi Yi Sun-sin)","era":"161–223","category":"Chính trị & quân sự","wiki":"Liu_Bei","crop":"liu-bei-p.JPG","uncertain":true,"fullbio":"Lưu Bị là nhà quân phiệt cuối thời Đông Hán và người lập nên nhà Thục Hán trong thời Tam Quốc Trung Hoa. Ông xưng đế năm 221, được biết đến qua các mối liên hệ với Quan Vũ, Trương Phi và Gia Cát Lượng. Hình tượng của ông là một phần cốt lõi của tiểu thuyết Tam Quốc diễn nghĩa. Nhiều bản giải mã tranh gán nhân vật mặc giáp này khác nhau, trong đó ClipTank nhận diện là Lưu Bị.\n\nLưu Bị sống vào thời cuối Đông Hán, dần xây dựng thế lực chính trị cùng các tướng Quan Vũ và Trương Phi trong truyền thống Tam Quốc. Ông lập nhà Thục Hán năm 221 và xưng đế, mở đầu một trong ba chính quyền lớn thời Tam Quốc. Tư liệu lịch sử và tiểu thuyết 'Tam Quốc diễn nghĩa' mô tả ông không hoàn toàn giống nhau; chân dung là tranh tái dựng.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/liu-bei.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":92,"name":"Mike Tyson","era":"1966–nay","category":"Thể thao","wiki":"Mike_Tyson","crop":"mike-tyson-painting.JPG","uncertain":false,"fullbio":"Mike Tyson là võ sĩ quyền Anh Mỹ nổi lên vào thập niên 1980. Năm 1986, ông trở thành nhà vô địch hạng nặng thế giới trẻ nhất ở tuổi 20. Sức mạnh đấm, phong cách thi đấu dữ dội và những bê bối ngoài sàn đấu khiến ông được biết đến rộng rãi. Mike Tyson xuất thân từ Brooklyn và trở thành nhà vô địch quyền Anh hạng nặng khi mới 20 tuổi năm 1986. Sức mạnh và tốc độ giúp ông nổi tiếng toàn cầu, song đời tư và sự nghiệp bị ảnh hưởng bởi các vụ bạo lực, án tù và sự kiện cắn tai đối thủ năm 1997.\n\nTyson trở thành vô địch quyền Anh hạng nặng thế giới ở tuổi 20 năm 1986, nổi bật bởi tốc độ, sức mạnh và cách tấn công áp đảo. Sự nghiệp của ông trải qua thất bại gây sốc trước Buster Douglas và nhiều tranh cãi ngoài võ đài. Tyson vẫn là một trong những cái tên được nhận biết rộng rãi nhất lịch sử boxing.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/mike-tyson-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":93,"name":"Vladimir Putin","era":"1952–nay","category":"Chính trị & quân sự","wiki":"Vladimir_Putin","crop":"Vladimir-Putin-painting.JPG","uncertain":false,"fullbio":"Putin là chính khách Nga nắm quyền lực trung tâm từ cuối năm 1999. Ông giữ chức tổng thống và thủ tướng qua nhiều giai đoạn, tác động mạnh tới chính sách nội trị và đối ngoại Nga. Các cuộc chiến ở Chechnya và Ukraine cùng xu hướng tập trung quyền lực khiến ông là nhân vật gây tranh cãi lớn. Putin từng phục vụ trong KGB trước khi tham gia chính quyền Nga, trở thành tổng thống đầu tiên năm 2000. Trong thời gian cầm quyền, Nga tập trung quyền lực mạnh, tiến hành chiến tranh tại Chechnya, sáp nhập Crimea năm 2014 và xâm lược toàn diện Ukraine năm 2022.\n\nPutin từng làm việc trong cơ quan tình báo KGB rồi bước vào chính trường Nga thập niên 1990. Ông nắm quyền lãnh đạo Nga từ năm 2000, luân chuyển giữa vai trò tổng thống và thủ tướng, và củng cố quyền lực trung ương. Các cuộc chiến với Gruzia và Ukraine cùng chính sách đối nội khiến ông trở thành nhân vật gây tranh cãi toàn cầu.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Vladimir%20Putin.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":94,"name":"Lewis Carroll (có nguồn ghi Andersen)","era":"1832–1898","category":"Văn học & triết học","wiki":"Lewis_Carroll","crop":"lewis-carroll-painting.JPG","uncertain":true,"fullbio":"Lewis Carroll là bút danh của Charles Lutwidge Dodgson, nhà văn và nhà toán học Anh thế kỷ XIX. Ông nổi tiếng với Alice ở xứ sở diệu kỳ và lối kể chuyện phi lý giàu tưởng tượng. Một số danh sách nhận diện khuôn mặt này là Hans Christian Andersen, tác giả truyện cổ tích Đan Mạch. Lewis Carroll là bút danh của Charles Lutwidge Dodgson, giảng viên toán tại Oxford thời Victoria. Alice’s Adventures in Wonderland và Through the Looking-Glass nổi tiếng nhờ logic phi lý và lối chơi ngôn ngữ; có nguồn giải tranh nhầm nhân vật với Andersen.\n\nLewis Carroll tên thật Charles Lutwidge Dodgson, là giảng viên toán học tại Oxford ở Anh thời Victoria. Ông viết 'Alice's Adventures in Wonderland' và 'Through the Looking-Glass', tạo nên thế giới tưởng tượng giàu nghịch lý ngôn ngữ. Ông còn chụp ảnh và nghiên cứu logic, nhưng tranh này có những bản định danh khác là Hans Christian Andersen.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/lewis-carroll-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":95,"name":"Shirley Temple","era":"1928–2014","category":"Âm nhạc & điện ảnh","wiki":"Shirley_Temple","crop":"shirley-temple-painting.JPG","uncertain":false,"fullbio":"Shirley Temple là diễn viên nhí Mỹ nổi tiếng trong thập niên 1930. Những bộ phim hài ca nhạc và khả năng nhảy múa khiến cô trở thành ngôi sao phòng vé khi còn nhỏ. Khi trưởng thành, bà chuyển sang hoạt động ngoại giao và từng làm đại sứ Mỹ. Shirley Temple là ngôi sao nhí Hollywood trong thời Đại khủng hoảng, nổi bật bởi khả năng diễn xuất, hát và múa. Khi trưởng thành, bà trở thành nhà ngoại giao Mỹ, từng giữ chức đại sứ tại Ghana và Tiệp Khắc.\n\nShirley Temple nổi tiếng từ khi còn nhỏ với khả năng hát, múa và diễn xuất trong các bộ phim Hollywood thập niên 1930. Khi trưởng thành, bà rời sự nghiệp điện ảnh và tham gia hoạt động chính trị, ngoại giao Mỹ. Bà từng làm đại sứ tại Ghana và Tiệp Khắc.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/shirley-temple-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":96,"name":"Albert Einstein","era":"1879–1955","category":"Khoa học & kinh doanh","wiki":"Albert_Einstein","crop":"Albert-Einstein-painting.JPG","uncertain":false,"fullbio":"Einstein là nhà vật lý lý thuyết gốc Đức hoạt động đầu thế kỷ XX. Ông xây dựng thuyết tương đối hẹp, tương đối rộng và giải thích hiệu ứng quang điện. Ông nhận Nobel Vật lý năm 1921 và trở thành biểu tượng phổ biến của trí tuệ khoa học. Einstein sinh tại Đức và làm việc ở Thụy Sĩ khi công bố các bài báo cách mạng năm 1905. Thuyết tương đối hẹp và rộng thay đổi cách hiểu về không–thời gian, còn giải Nobel Vật lý 1921 trao cho công trình giải thích hiệu ứng quang điện.\n\nEinstein năm 1905 công bố các công trình đột phá về hiệu ứng quang điện, chuyển động Brown và thuyết tương đối hẹp. Năm 1915, thuyết tương đối rộng của ông mô tả hấp dẫn như sự cong của không-thời gian. Ông đoạt Nobel Vật lý năm 1921 chủ yếu vì công trình giải thích hiệu ứng quang điện, chứ không phải vì thuyết tương đối.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Albert-Einstein-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":97,"name":"Charles Darwin (có nguồn ghi Moses)","era":"1809–1882","category":"Khoa học & kinh doanh","wiki":"Charles_Darwin","crop":"charles-darwin-p.JPG","uncertain":true,"fullbio":"Darwin là nhà tự nhiên học Anh ở thế kỷ XIX. Cuốn Nguồn gốc các loài năm 1859 trình bày bằng chứng cho tiến hóa thông qua chọn lọc tự nhiên. Hình tượng người đàn ông râu dài mặc áo choàng trong tranh cũng bị một số danh sách gán cho Moses hoặc Noah. Darwin tham gia chuyến hải trình trên tàu HMS Beagle thập niên 1830, tích lũy quan sát sinh học và địa chất. Năm 1859, ông công bố Nguồn gốc các loài, trình bày tiến hóa qua chọn lọc tự nhiên; riêng cách gán hình vẽ Darwin trong tác phẩm có nguồn khác ghi Moses/Noah.\n\nDarwin tham gia chuyến hải hành của tàu HMS Beagle từ năm 1831 đến 1836, thu thập mẫu vật và quan sát sinh giới. Năm 1859, ông xuất bản 'Nguồn gốc các loài', lập luận rằng chọn lọc tự nhiên góp phần giải thích sự biến đổi của sinh vật qua nhiều thế hệ. Tư tưởng này là nền tảng của sinh học tiến hóa hiện đại và từng gây tranh cãi với một số cách hiểu tôn giáo.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/charles-darwin.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":98,"name":"Khổng Tử","era":"khoảng 551–479 TCN","category":"Triết học & tôn giáo","wiki":"Confucius","crop":"confucius-p.JPG","uncertain":false,"fullbio":"Khổng Tử là nhà tư tưởng Trung Hoa thời Xuân Thu, thế kỷ VI–V trước Công nguyên. Những lời dạy về nhân, lễ, giáo dục và trật tự xã hội được các môn đệ ghi chép trong Luận ngữ. Nho giáo từ đó ảnh hưởng sâu sắc tới văn hóa và thể chế Đông Á, gồm cả Việt Nam. Khổng Tử sống cuối thời Xuân Thu Trung Quốc, đi qua nhiều nước chư hầu và dạy học về đạo đức, chính trị và lễ nghi. Những lời dạy được hậu thế ghi trong Luận ngữ, tác động mạnh đến giáo dục và tổ chức xã hội Đông Á.\n\nKhổng Tử hoạt động vào cuối thời Xuân Thu, chú trọng việc giáo dục đạo đức và xây dựng trật tự xã hội dựa trên nhân, lễ, nghĩa. Lời dạy của ông được học trò và những thế hệ sau ghi lại trong 'Luận ngữ'. Nho học ảnh hưởng đến giáo dục, thi cử, tổ chức nhà nước và gia đình tại nhiều quốc gia Đông Á, trong đó có Việt Nam.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/confucius.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":99,"name":"Mahatma Gandhi","era":"1869–1948","category":"Chính trị & quân sự","wiki":"Mahatma_Gandhi","crop":"mohandas-gandhi-p.JPG","uncertain":false,"fullbio":"Gandhi là nhà hoạt động chính trị và xã hội Ấn Độ nửa đầu thế kỷ XX. Ông lãnh đạo nhiều phong trào bất hợp tác và bất bạo động chống chế độ thực dân Anh. Phương pháp đấu tranh của ông truyền cảm hứng cho các phong trào dân quyền trên thế giới. Gandhi được đào tạo luật tại Anh và bắt đầu vận động chống phân biệt đối xử khi sống ở Nam Phi. Ông phát triển satyagraha – đấu tranh bất bạo động – khi lãnh đạo phong trào độc lập Ấn Độ; ông bị ám sát năm 1948.\n\nGandhi học luật tại London và hoạt động chống phân biệt chủng tộc tại Nam Phi trước khi trở về Ấn Độ. Ông lãnh đạo nhiều chiến dịch bất tuân dân sự, nổi tiếng có cuộc Hành trình Muối năm 1930 phản đối thuế muối của Anh. Ông bị ám sát năm 1948, ít lâu sau khi Ấn Độ độc lập; tư tưởng bất bạo động ảnh hưởng đến Martin Luther King Jr. và nhiều phong trào dân quyền.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/mohandas-gandhi.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":100,"name":"Vincent van Gogh","era":"1853–1890","category":"Nghệ thuật & kiến trúc","wiki":"Vincent_van_Gogh","crop":"vincent-van-gogh-p.JPG","uncertain":false,"fullbio":"Van Gogh là họa sĩ Hà Lan thuộc khuynh hướng Hậu Ấn tượng cuối thế kỷ XIX. Ông sáng tác Đêm đầy sao, Hoa hướng dương và nhiều tranh chân dung với nét cọ mạnh, màu sắc rực rỡ. Khi còn sống ông ít thành công về tài chính nhưng về sau trở thành một họa sĩ nổi tiếng nhất thế giới. Van Gogh là họa sĩ Hà Lan theo đuổi hội họa ở Pháp cuối thế kỷ XIX, sử dụng nét cọ dày và màu sắc biểu cảm. Ông tạo ra Hoa hướng dương, Đêm đầy sao và nhiều chân dung tự họa, nhưng sống nghèo khó và chỉ được công nhận rộng rãi sau khi qua đời.\n\nVan Gogh bắt đầu vẽ chuyên nghiệp tương đối muộn, để lại hàng nghìn bản vẽ và tranh trong khoảng một thập niên cuối đời. Ông sử dụng nét cọ mạnh và màu sắc biểu cảm trong các tác phẩm như 'The Starry Night' và 'Sunflowers'. Khi còn sống ông không được công nhận rộng rãi; tên tuổi trở nên nổi tiếng đặc biệt sau khi qua đời năm 1890.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/vincent-van-gogh.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":101,"name":"Henri de Toulouse-Lautrec","era":"1864–1901","category":"Nghệ thuật & kiến trúc","wiki":"Henri_de_Toulouse-Lautrec","crop":"Henri-de-Toulouse-Lautrec.JPG","uncertain":false,"fullbio":"Toulouse-Lautrec là họa sĩ và nghệ sĩ đồ họa Pháp cuối thế kỷ XIX. Ông khắc họa các quán rượu, nghệ sĩ biểu diễn và đời sống khu Montmartre ở Paris. Những áp phích Moulin Rouge của ông góp phần định hình nghệ thuật quảng cáo hiện đại. Toulouse-Lautrec xuất thân quý tộc Pháp nhưng có thể trạng thấp do bệnh xương, gắn bó với đời sống nghệ sĩ Montmartre ở Paris. Những áp phích cho Moulin Rouge và tranh đời sống quán rượu, sân khấu đã định hình phong cách đồ họa hiện đại.\n\nToulouse-Lautrec thuộc giới quý tộc Pháp nhưng dành nhiều thời gian tại các quán rượu và sân khấu Montmartre ở Paris. Ông nổi tiếng với tranh và áp phích quảng cáo cho Moulin Rouge, thể hiện sắc nét đời sống giải trí đô thị. Phong cách của ông kết nối hội họa, minh họa, quảng cáo và văn hóa đại chúng cuối thế kỷ XIX.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/Henri-de-Toulouse-Lautrec-p.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":102,"name":"Marcel Duchamp","era":"1887–1968","category":"Nghệ thuật & kiến trúc","wiki":"Marcel_Duchamp","crop":"marcel-duchamp-p.JPG","uncertain":false,"fullbio":"Duchamp là nghệ sĩ Pháp–Mỹ có ảnh hưởng đặc biệt tới nghệ thuật thế kỷ XX. Tác phẩm Fountain năm 1917 đặt câu hỏi về việc điều gì có thể được coi là nghệ thuật. Ông là một người mở đường cho nghệ thuật ý niệm và tư duy ready-made. Duchamp hoạt động trong các phong trào tiên phong ở Pháp và Mỹ đầu thế kỷ XX. Ông gây tranh luận với Fountain, chiếc bồn tiểu được đặt làm tác phẩm ready-made, qua đó thay đổi quan niệm nghệ thuật dựa trên ý tưởng thay vì kỹ thuật thủ công.\n\nDuchamp khởi đầu bằng hội họa nhưng chuyển sang đặt câu hỏi về bản chất nghệ thuật thông qua các vật dụng làm sẵn ('readymades'). Tác phẩm 'Fountain' năm 1917, một chiếc bồn tiểu được đưa vào bối cảnh nghệ thuật, gây tranh luận kéo dài. Ông trở thành tiền thân quan trọng của nghệ thuật ý niệm và nhiều phong trào hậu hiện đại.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/marcel-duchamp.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false},{"id":103,"name":"Osama bin Laden","era":"1957–2011","category":"Chính trị & quân sự","wiki":"Osama_bin_Laden","crop":"osama-bin-laden-painting.JPG","uncertain":false,"fullbio":"Osama bin Laden là người sáng lập tổ chức khủng bố al-Qaeda vào cuối thập niên 1980. Tổ chức này thực hiện các vụ tấn công khủng bố, nổi bật là vụ 11 tháng 9 năm 2001 tại Mỹ. Ông bị lực lượng Mỹ tiêu diệt tại Pakistan năm 2011. Bin Laden sinh trong gia đình giàu có tại Saudi Arabia, tham gia mạng lưới chiến binh chống Liên Xô ở Afghanistan. Sau đó ông lập al-Qaeda, tổ chức khủng bố chịu trách nhiệm các vụ đánh bom và tấn công ngày 11/9/2001; ông bị lực lượng Mỹ tiêu diệt năm 2011.\n\nBin Laden sinh tại Saudi Arabia, tham gia mạng lưới chiến binh trong chiến tranh Afghanistan thập niên 1980 rồi thành lập al-Qaeda. Tổ chức này chịu trách nhiệm vụ khủng bố ngày 11/9/2001 tại Mỹ, gây thiệt mạng gần 3.000 người và châm ngòi các chiến dịch chống khủng bố toàn cầu. Ông bị lực lượng Mỹ tiêu diệt tại Pakistan năm 2011.","portrait":"https://cliptank.com/PeopleofInfluencePainting_files/osama-bin-laden-photo.JPG","portrait_src":"ClipTank","photo_group":false,"photo_fictional":false,"photo_reenactment":false,"is_paired":false}];

const HIGH_RES='https://cliptank.com/PeopleofInfluencePainting.htm';

const AMBIGUOUS={2:'Trang ClipTank xác định là Plato nhưng một số danh sách ghi Homer.',55:'Ảnh cắt trong tranh gắn với tên Tagore theo bảng ClipTank; nguồn ảnh dùng tên tập tin khác và cần thận trọng về định danh.',78:'Bảng ClipTank sửa cách nhận diện từ Jonas Salk thành Norman Bethune; ảnh ngoài đời dùng chân dung Bethune từ Wikimedia Commons.',80:'Trang ClipTank xác định Jack Kevorkian; có danh sách phổ biến ghi Juan Antonio Samaranch.',86:'Bản giải mã ClipTank xác định nhân vật ở vị trí này là Aristotle, trong khi một số danh sách khác ghi Auguste Rodin.',91:'Bản giải mã ClipTank gán chân dung áo giáp này cho Lưu Bị; nhiều danh sách lại ghi Yi Sun-sin.',94:'Bảng ClipTank xác định Lewis Carroll; danh sách phổ biến khác ghi Hans Christian Andersen.',97:'Trang ClipTank xác định Charles Darwin, trong khi một số nguồn gọi là Moses hoặc Noah.'};
const PREPHOTO=new Set([2,7,12,13,18,28,31,32,39,40,45,46,52,58,60,70,84,86,90,91,97,98,100]);

const wikipedia=p=>'https://en.wikipedia.org/wiki/'+encodeURIComponent(p.wiki).replace(/%2F/g,'/');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function photoLabel(p){if(p.photo_group)return 'Ảnh 3 tác giả';if(p.photo_fictional)return 'Diễn viên tái hiện';if(p.photo_reenactment)return 'Hình tái hiện';if(PREPHOTO.has(p.id))return 'Tranh / tượng tư liệu';return 'Ảnh đời thực'}
function imageFail(img){const el=img.parentElement;const u=img.getAttribute('src');el.innerHTML='<div class="sourcefallback">Không tải được ảnh từ nguồn.<div><a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Mở ảnh nguồn ↗</a></div></div>'}
function img(p,kind,modal=false){const isPaint=kind==='paint',pair=p.is_paired,url=isPaint?CROP_PREFIX+p.crop:p.portrait,label=isPaint?'Ảnh trong tranh':photoLabel(p),imgAlt=esc(p.name+' — '+label);
 const inside=pair?'<div class="pairedframe '+(isPaint?'left':'right')+'"><img alt="'+imgAlt+'" loading="lazy" decoding="async" src="'+esc(url)+'" onerror="imageFail(this)" /></div>':'<img alt="'+imgAlt+'" loading="lazy" decoding="async" src="'+esc(url)+'" onerror="imageFail(this)" />';
 return '<div class="'+(modal?'mimg':'')+'"><div class="'+(isPaint?'paintbox':'realbox')+'">'+inside+'<span class="piccaption">'+label+'</span></div></div>'}
function filtered(){const fold=t=>String(t).toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'),q=fold(state.query);let rows=PEOPLE.filter(p=>(!state.cat||p.category===state.cat)&&(!q||fold([p.name,p.era,p.category,p.fullbio].join(' ')).includes(q)));if(state.sort==='name')rows.sort((a,b)=>a.name.localeCompare(b.name,'vi'));if(state.sort==='uncertain')rows.sort((a,b)=>Number(a.uncertain)-Number(b.uncertain));return rows}
function render(){const rows=filtered();document.getElementById('count').textContent='Hiển thị '+rows.length+' / 103 nhân vật';document.getElementById('grid').innerHTML=rows.length?rows.map(p=>'<article role="button" tabindex="0" class="person" data-id="'+p.id+'" aria-label="Xem tiểu sử '+esc(p.name)+'"><div class="twoImage">'+img(p,'paint')+img(p,'real')+'</div><div class="inf"><div class="name">'+p.id+'. '+esc(p.name)+'</div><div class="era">'+esc(p.era)+'</div><div class="cat">'+esc(p.category)+'</div>'+(p.uncertain||AMBIGUOUS[p.id]?'<div class="unknown">⚠ Có lưu ý về định danh</div>':'')+'<div class="cardactions"><button class="bioAction" data-view="'+p.id+'">Xem tiểu sử</button></div></div></article>').join(''):'<div class="nothing">Không tìm thấy nhân vật phù hợp.</div>';document.querySelectorAll('.person').forEach(node=>{node.querySelector('.bioAction').onclick=e=>{e.stopPropagation();openDetail(+node.dataset.id)};node.onclick=()=>openDetail(+node.dataset.id);node.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(+node.dataset.id)}}})}
function openDetail(id){const p=PEOPLE[id-1],d=document.getElementById('detail');d.innerHTML='<div class="mcategory">#'+p.id+' · '+esc(p.category)+'</div><h2 class="mtitle">'+esc(p.name)+'</h2><div class="mperiod">'+esc(p.era)+'</div><div class="mimgs">'+img(p,'paint',true)+img(p,'real',true)+'</div>'+(p.photo_group?'<p class="imageNote">Ảnh ngoài đời là ảnh chụp chung ba họa sĩ; chưa xác minh chắc chắn vị trí từng người trong ảnh.</p>':'')+(p.photo_fictional?'<p class="imageNote">Pavel là nhân vật hư cấu; hình đối chiếu là người thể hiện nhân vật, không phải ảnh của Pavel ngoài đời.</p>':'')+(p.photo_reenactment?'<p class="imageNote">Chân dung ngoài tranh là hình tái hiện nghệ thuật của Thành Cát Tư Hãn, không phải ảnh chụp lịch sử.</p>':'')+'<div class="bioHeading">Tiểu sử</div><div class="biotxt">'+esc(p.fullbio)+'</div>'+(AMBIGUOUS[p.id]?'<div class="alert"><b>Lưu ý nhận diện:</b> '+esc(AMBIGUOUS[p.id])+'</div>':'')+'<div class="links"><a target="_blank" rel="noopener noreferrer" href="'+wikipedia(p)+'">Đọc hồ sơ tham khảo ↗</a><a target="_blank" rel="noopener noreferrer" href="https://cliptank.com/history-painting-famous-answers.html">So sánh nguồn ClipTank ↗</a></div>';document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}
function close(){document.getElementById('modal').classList.remove('open');if(!document.getElementById('paintingModal').classList.contains('open'))document.body.style.overflow=''}
document.getElementById('close').onclick=close;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();closePainting()}});document.getElementById('search').oninput=e=>{state.query=e.target.value;render()};document.getElementById('cat').onchange=e=>{state.cat=e.target.value;render()};document.getElementById('sort').onchange=e=>{state.sort=e.target.value;render()};
const cats=[...new Set(PEOPLE.map(p=>p.category))].sort((a,b)=>a.localeCompare(b,'vi'));document.getElementById('cat').insertAdjacentHTML('beforeend',cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join(''));
document.getElementById('panorama').src=PANORAMA;render();
// Bản ảnh nguyên gốc có thể phóng to: mouse drag, wheel, pinch, double tap.
const viewer=document.getElementById('viewerViewport'),zoomImg=document.getElementById('zoomImage');
let z=1,x=0,y=0,lastTap=0,gesture=null;const activePointers=new Map();
function minScale(){const r=viewer.getBoundingClientRect();return Math.min(r.width/2600,r.height/1127)}
function clampPos(){const r=viewer.getBoundingClientRect(),iw=r.width*z,ih=r.height*z;const mx=Math.max(0,(iw-r.width)/2),my=Math.max(0,(ih-r.height)/2);x=Math.min(mx,Math.max(-mx,x));y=Math.min(my,Math.max(-my,y))}
function repaint(){clampPos();zoomImg.style.transform='translate('+x+'px,'+y+'px) scale('+z+')';document.getElementById('zoomPct').textContent=Math.round(z*100)+'%'}
function setZoom(v,px,py){const newZ=Math.min(10,Math.max(1,v));if(px!==undefined){const r=viewer.getBoundingClientRect(),rx=px-r.left-r.width/2,ry=py-r.top-r.height/2;x+=rx*(1-newZ/z);y+=ry*(1-newZ/z)}z=newZ;repaint()}
function openPainting(){document.getElementById('paintingModal').classList.add('open');document.body.style.overflow='hidden';zoomImg.src=PANORAMA;zoomImg.onerror=()=>{zoomImg.src='https://p4.wallpaperbetter.com/wallpaper/616/365/265/discussing-the-divine-comedy-with-dante-100-celebrities-large-canvas-wallpaper-preview.jpg'};z=1;x=0;y=0;repaint()}
function closePainting(){document.getElementById('paintingModal').classList.remove('open');if(!document.getElementById('modal').classList.contains('open'))document.body.style.overflow='';activePointers.clear();gesture=null}
document.getElementById('openPainting').onclick=openPainting;
document.getElementById('closePainting').onclick=closePainting;
document.getElementById('paintingModal').onclick=e=>{if(e.target.id==='paintingModal')closePainting()};
document.getElementById('plusZoom').onclick=()=>setZoom(z*1.5);
document.getElementById('minusZoom').onclick=()=>setZoom(z/1.5);
document.getElementById('resetZoom').onclick=()=>{z=1;x=0;y=0;repaint()};
viewer.addEventListener('wheel',e=>{e.preventDefault();setZoom(z*(e.deltaY<0?1.18:1/1.18),e.clientX,e.clientY)},{passive:false});
viewer.addEventListener('pointerdown',e=>{viewer.setPointerCapture(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===2){const a=[...activePointers.values()];gesture={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),z,x,y,centerX:(a[0].x+a[1].x)/2,centerY:(a[0].y+a[1].y)/2}}});
viewer.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;const old=activePointers.get(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===2&&gesture){const a=[...activePointers.values()];const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);setZoom(gesture.z*dist/Math.max(1,gesture.distance),(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2)}else if(activePointers.size===1){x+=e.clientX-old.x;y+=e.clientY-old.y;repaint()}});
function endPtr(e){activePointers.delete(e.pointerId);gesture=null}viewer.addEventListener('pointerup',endPtr);viewer.addEventListener('pointercancel',endPtr);
viewer.addEventListener('dblclick',e=>{e.preventDefault();setZoom(z<2?3:1,e.clientX,e.clientY)});
viewer.addEventListener('touchend',e=>{if(e.touches.length>0)return;const t=Date.now();if(t-lastTap<310){const p=e.changedTouches[0];setZoom(z<2?3:1,p.clientX,p.clientY)}lastTap=t},{passive:true});
</script></body></html>
